<!-- templates/fragments/header.html -->
<header th:fragment="header"
        class="flex flex-wrap items-center justify-between whitespace-nowrap border-b border-solid border-border-color bg-surface px-10 py-3 sticky top-0 z-50"
        xmlns:sec="http://www.w3.org/1999/xhtml">

    <!-- Logo -->
    <a th:href="@{/}">
        <div class="flex items-center gap-4 text-text-main">
            <div class="size-8 text-primary flex items-center justify-center">
                <img th:src="@{/images/Logo.png}" alt="Carburo Logo"/>
            </div>
            <h2 class="text-text-main text-xl font-bold leading-tight tracking-[-0.015em]"
                th:text="#{header.logo.nombre}"></h2>
        </div>
    </a>

    <!-- Botón hamburguesa móvil -->
    <button class="md:hidden flex items-center px-2 py-1 text-text-main ml-auto"
            onclick="document.getElementById('mobileMenu').classList.toggle('hidden')">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <!-- Navegación y botones (desktop) -->
    <div class="hidden md:flex flex-1 justify-end gap-6 items-center">
        <!-- Menú principal -->
        <nav class="hidden md:flex items-center gap-9">
            <a th:href="@{/}"
               th:class="${pagina == 'inicio'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
               'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.inicio}"></a>

            <a th:href="@{/estaciones-de-servicio}"
               th:class="${pagina == 'eess'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
              'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.estaciones}"></a>


            <a sec:authorize="isAuthenticated()" th:href="@{/perfil/estaciones-de-servicio/favoritas}"
               th:class="${pagina == 'eessFav'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
               'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.favoritos}"></a>

            <a sec:authorize="isAuthenticated()" th:href="@{/vehiculos}"
               th:class="${pagina == 'vehiculos'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
               'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.vehiculos}"></a>

            <a sec:authorize="isAuthenticated()" th:href="@{/repostajes}"
               th:class="${pagina == 'repostajes'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
               'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.repostajes}"></a>

            <a th:href="@{/contacto}"
               th:class="${pagina == 'contacto'} ? 'text-primary text-sm font-bold leading-normal transition-colors' :
               'text-main text-sm font-medium leading-normal hover:text-primary transition-colors'"
               th:text="#{header.nav.contacto}"></a>
        </nav>

        <!-- Botones -->
        <div class="flex gap-2 items-center">
            <!-- IDIOMA -->
            <div class="nav-item dropdown relative">
                <button class="nav-link dropdown-toggle flex items-center gap-1 cursor-pointer hover:text-primary"
                        id="btnLanguage" tabindex="0" aria-haspopup="true" aria-expanded="false"
                        onclick="toggleDropdown()">
                    <span class="material-symbols-outlined">language</span>
                    <span th:text="#{header.nav.boton.idioma}"></span>
                </button>

                <!-- Dropdown -->
                <div id="languageDropdownMenuButton"
                     class="dropdown-menu absolute mt-2 right-0 w-36 bg-white border rounded-lg shadow-lg hidden z-50">
                    <!-- Lista de idiomas como botones -->
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="ES"><span th:text="#{language.es}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="EN"><span th:text="#{language.en}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="FR"><span th:text="#{language.fr}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="IT"><span th:text="#{language.it}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="PT"><span th:text="#{language.pt}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="CA"><span th:text="#{language.ca}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="GL"><span th:text="#{language.gl}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="EU"><span th:text="#{language.eu}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="OC"><span th:text="#{language.oc}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="AST"><span th:text="#{language.ast}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="AN"><span th:text="#{language.an}"></span></button>
                </div>
            </div>

            <!-- Botón registrarse -->
            <a th:href="@{/registro}" sec:authorize="!isAuthenticated()" th:text="#{header.nav.boton.registrarse}"
               th:class="${pagina == 'registro'} ? 'flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary hover:bg-primary/90 transition-colors text-white text-sm font-bold' :
               'flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-border-color hover:bg-[#ebdccf] transition-colors text-text-main text-sm font-bold'"></a>

            <!-- Botón iniciar sesión -->
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()" th:text="#{header.nav.boton.iniciar}"
               th:class="${pagina != 'registro'} ? 'flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-primary hover:bg-primary/90 transition-colors text-white text-sm font-bold' :
               'flex min-w-[84px] cursor-pointer items-center justify-center rounded-lg h-10 px-4 bg-border-color hover:bg-[#ebdccf] transition-colors text-text-main text-sm font-bold'"></a>


            <div class="flex gap-2 items-center" sec:authorize="isAuthenticated()">
                <form th:action="@{/perfil}" method="get">
                    <button class="flex items-center gap-2 bg-primary/10 text-primary border border-primary/20 rounded-full py-1.5 pl-1.5 pr-4 hover:bg-primary/20 transition-colors"
                            type="submit">
                        <span class="size-7 bg-primary rounded-full flex items-center justify-center text-white">
                            <span class="material-symbols-outlined text-sm">person</span>
                        </span>
                        <span class="text-sm font-bold" th:text="#{header.nav.boton.perfil}"></span>
                    </button>
                </form>
                <form th:action="@{/logout}" method="post">
                    <button class="flex items-center gap-2 bg-red-500/10 text-red-600 border border-red-500/20 rounded-full py-1.5 pl-1.5 pr-4 hover:bg-red-500/20 transition-colors"
                            type="submit">

                        <span class="size-7 bg-red-600 rounded-full flex items-center justify-center text-white">
                            <span class="material-symbols-outlined text-sm">logout</span>
                        </span>
                        <span class="text-sm font-bold" th:text="#{auth.perfil.cerrar.sesion}"></span>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Menú móvil -->
    <div id="mobileMenu" class="w-full md:hidden hidden mt-4 flex-col gap-4">

        <!-- Navegación móvil -->
        <nav class="flex flex-col gap-3 border-b border-border-color pb-4">
            <a th:href="@{/}"
               th:class="${pagina == 'inicio'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.inicio}"></a>

            <a th:href="@{/estaciones-de-servicio}"
               th:class="${pagina == 'eess'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.estaciones}"></a>

            <a sec:authorize="isAuthenticated()" th:href="@{/perfil/estaciones-de-servicio/favoritas}"
               th:class="${pagina == 'eessFav'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.favoritos}"></a>

            <a sec:authorize="isAuthenticated()" th:href="@{/vehiculos}"
               th:class="${pagina == 'vehiculos'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.vehiculos}"></a>

            <a sec:authorize="isAuthenticated()" th:href="@{/repostajes}"
               th:class="${pagina == 'repostajes'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.boton.repostajes}"></a>

            <a th:href="@{/contacto}"
               th:class="${pagina == 'contacto'} ? 'text-primary text-sm font-bold' :
           'text-main text-sm font-medium hover:text-primary transition-colors'"
               th:text="#{header.nav.contacto}"></a>
        </nav>

        <!-- Acciones móvil -->
        <div class="flex flex-col gap-3 pt-4">

            <!-- NO autenticado -->
            <a th:href="@{/registro}" sec:authorize="!isAuthenticated()"
               class="flex w-full justify-center items-center rounded-lg h-10 px-4
                  bg-border-color hover:bg-[#ebdccf] transition-colors
                  text-text-main text-sm font-bold"
               th:text="#{header.nav.boton.registrarse}"></a>

            <a th:href="@{/login}" sec:authorize="!isAuthenticated()"
               class="flex w-full justify-center items-center rounded-lg h-10 px-4
                  bg-primary hover:bg-primary/90 transition-colors
                  text-white text-sm font-bold"
               th:text="#{header.nav.boton.iniciar}"></a>

            <!-- Autenticado -->
            <form th:action="@{/perfil}" method="get" sec:authorize="isAuthenticated()">
                <button type="submit"
                        class="flex w-full items-center justify-center gap-2
                           bg-primary/10 text-primary border border-primary/20
                           rounded-lg h-10 px-4 hover:bg-primary/20 transition-colors">
                    <span class="material-symbols-outlined text-sm">person</span>
                    <span class="text-sm font-bold" th:text="#{header.nav.boton.perfil}"></span>
                </button>
            </form>

            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit"
                        class="flex w-full items-center justify-center gap-2
                           bg-red-500/10 text-red-600 border border-red-500/20
                           rounded-lg h-10 px-4 hover:bg-red-500/20 transition-colors">
                    <span class="material-symbols-outlined text-sm">logout</span>
                    <span class="text-sm font-bold" th:text="#{auth.perfil.cerrar.sesion}"></span>
                </button>
            </form>

            <!-- Idioma móvil -->
            <div class="nav-item dropdown relative pt-2">
                <button class="nav-link dropdown-toggle flex items-center justify-center gap-2
                           cursor-pointer hover:text-primary w-full"
                        id="btnLanguageMobile"
                        tabindex="0"
                        aria-haspopup="true"
                        aria-expanded="false"
                        >
                    <span class="material-symbols-outlined text-sm">language</span>
                    <span th:text="#{header.nav.boton.idioma}"></span>
                </button>

                <div id="languageDropdownMobile"
                     class="dropdown-menu absolute mt-2 right-0 w-40 bg-white border rounded-lg shadow-lg hidden z-50">
                    <!-- Lista de idiomas como botones -->
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="ES"><span th:text="#{language.es}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="EN"><span th:text="#{language.en}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="FR"><span th:text="#{language.fr}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="IT"><span th:text="#{language.it}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="PT"><span th:text="#{language.pt}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="CA"><span th:text="#{language.ca}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="GL"><span th:text="#{language.gl}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="EU"><span th:text="#{language.eu}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="OC"><span th:text="#{language.oc}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="AST"><span th:text="#{language.ast}"></span></button>
                    <button class="dropdown-item flex items-center gap-2 px-4 py-2 hover:bg-gray-100 w-full text-left"
                            data-value="AN"><span th:text="#{language.an}"></span></button>
                </div>
            </div>
        </div>
    </div>
</header>
