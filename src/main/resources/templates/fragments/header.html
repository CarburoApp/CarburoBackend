<header th:fragment="header" class="site-header" xmlns:sec="http://www.w3.org/1999/xhtml">
    <a class="site-brand" th:href="@{/}">
        <img th:src="@{/images/Logo_comprimido.png}" alt=""/>
        <span th:text="#{header.logo.nombre}"></span>
    </a>

    <button class="menu-toggle" type="button" popovertarget="mobileMenu" aria-controls="mobileMenu">
        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
            <use href="/images/icons.svg#menu"></use>
        </svg>
        <span class="visually-hidden" th:text="#{header.nav.boton.menu}">Menu</span>
    </button>

    <div class="site-header-content">
        <nav class="primary-navigation" th:aria-label="#{header.nav.principal}">
            <a class="nav-link"
               th:classappend="${pagina == 'inicio'} ? 'is-current'"
               th:href="@{/}"
               th:text="#{header.nav.boton.inicio}"></a>
            <a class="nav-link"
               th:classappend="${pagina == 'eess'} ? 'is-current'"
               th:href="@{/estaciones-de-servicio}"
               th:text="#{header.nav.boton.estaciones}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'eessFav'} ? 'is-current'"
               th:href="@{/perfil/estaciones-de-servicio/favoritas}"
               th:text="#{header.nav.boton.favoritos}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'vehiculos'} ? 'is-current'"
               th:href="@{/vehiculos}"
               th:text="#{header.nav.boton.vehiculos}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'repostajes'} ? 'is-current'"
               th:href="@{/repostajes}"
               th:text="#{header.nav.boton.repostajes}"></a>
            <a class="nav-link"
               th:classappend="${pagina == 'contacto'} ? 'is-current'"
               th:href="@{/contacto}"
               th:text="#{header.nav.contacto}"></a>
        </nav>

        <div class="header-actions">
            <div class="language-picker">
                <button class="language-toggle language-toggle-desktop" id="btnLanguage" type="button"
                        popovertarget="languageDropdownMenuButton">
                    <svg class="icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <use href="/images/icons.svg#globe"></use>
                    </svg>
                    <span th:text="${#locale.getDisplayLanguage(#locale)}"></span>
                </button>
                <div id="languageDropdownMenuButton" class="dropdown-menu" popover="auto">
                    <button class="dropdown-item" type="button" data-value="ES" th:text="#{language.es}"></button>
                    <button class="dropdown-item" type="button" data-value="EN" th:text="#{language.en}"></button>
                    <button class="dropdown-item" type="button" data-value="FR" th:text="#{language.fr}"></button>
                    <button class="dropdown-item" type="button" data-value="IT" th:text="#{language.it}"></button>
                    <button class="dropdown-item" type="button" data-value="PT" th:text="#{language.pt}"></button>
                    <button class="dropdown-item" type="button" data-value="CA" th:text="#{language.ca}"></button>
                    <button class="dropdown-item" type="button" data-value="GL" th:text="#{language.gl}"></button>
                    <button class="dropdown-item" type="button" data-value="EU" th:text="#{language.eu}"></button>
                    <button class="dropdown-item" type="button" data-value="OC" th:text="#{language.oc}"></button>
                    <button class="dropdown-item" type="button" data-value="AST" th:text="#{language.ast}"></button>
                    <button class="dropdown-item" type="button" data-value="AN" th:text="#{language.an}"></button>
                </div>
            </div>

            <a class="button" th:href="@{/registro}" sec:authorize="!isAuthenticated()"
               th:text="#{header.nav.boton.registrarse}"></a>
            <a class="button button-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()"
               th:text="#{header.nav.boton.iniciar}"></a>

            <div class="header-identity" sec:authorize="isAuthenticated()">
                <form th:action="@{/perfil}" method="get">
                    <button type="submit" th:text="#{header.nav.boton.perfil}"></button>
                </form>
                <form th:action="@{/logout}" method="post">
                    <button type="submit" th:text="#{auth.perfil.cerrar.sesion}"></button>
                </form>
            </div>
        </div>
    </div>

    <div id="mobileMenu" class="mobile-menu" popover="auto">
        <nav th:aria-label="#{header.nav.principal}">
            <a class="nav-link"
               th:classappend="${pagina == 'inicio'} ? 'is-current'"
               th:href="@{/}"
               th:text="#{header.nav.boton.inicio}"></a>
            <a class="nav-link"
               th:classappend="${pagina == 'eess'} ? 'is-current'"
               th:href="@{/estaciones-de-servicio}"
               th:text="#{header.nav.boton.estaciones}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'eessFav'} ? 'is-current'"
               th:href="@{/perfil/estaciones-de-servicio/favoritas}"
               th:text="#{header.nav.boton.favoritos}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'vehiculos'} ? 'is-current'"
               th:href="@{/vehiculos}"
               th:text="#{header.nav.boton.vehiculos}"></a>
            <a class="nav-link"
               sec:authorize="isAuthenticated()"
               th:classappend="${pagina == 'repostajes'} ? 'is-current'"
               th:href="@{/repostajes}"
               th:text="#{header.nav.boton.repostajes}"></a>
            <a class="nav-link"
               th:classappend="${pagina == 'contacto'} ? 'is-current'"
               th:href="@{/contacto}"
               th:text="#{header.nav.contacto}"></a>
        </nav>
        <div class="mobile-actions">
            <a class="button" th:href="@{/registro}" sec:authorize="!isAuthenticated()"
               th:text="#{header.nav.boton.registrarse}"></a>
            <a class="button button-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()"
               th:text="#{header.nav.boton.iniciar}"></a>
            <form th:action="@{/perfil}" method="get" sec:authorize="isAuthenticated()">
                <button type="submit" th:text="#{header.nav.boton.perfil}"></button>
            </form>
            <form th:action="@{/logout}" method="post" sec:authorize="isAuthenticated()">
                <button type="submit" th:text="#{auth.perfil.cerrar.sesion}"></button>
            </form>
            <div class="language-picker">
                <button class="language-toggle language-toggle-mobile" id="btnLanguageMobile" type="button"
                        popovertarget="languageDropdownMobile">
                    <svg class="icon" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                        <use href="/images/icons.svg#globe"></use>
                    </svg>
                    <span th:text="${#locale.getDisplayLanguage(#locale)}"></span>
                </button>
                <div id="languageDropdownMobile" class="dropdown-menu" popover="auto">
                    <button class="dropdown-item" type="button" data-value="ES" th:text="#{language.es}"></button>
                    <button class="dropdown-item" type="button" data-value="EN" th:text="#{language.en}"></button>
                    <button class="dropdown-item" type="button" data-value="FR" th:text="#{language.fr}"></button>
                    <button class="dropdown-item" type="button" data-value="IT" th:text="#{language.it}"></button>
                    <button class="dropdown-item" type="button" data-value="PT" th:text="#{language.pt}"></button>
                    <button class="dropdown-item" type="button" data-value="CA" th:text="#{language.ca}"></button>
                    <button class="dropdown-item" type="button" data-value="GL" th:text="#{language.gl}"></button>
                    <button class="dropdown-item" type="button" data-value="EU" th:text="#{language.eu}"></button>
                    <button class="dropdown-item" type="button" data-value="OC" th:text="#{language.oc}"></button>
                    <button class="dropdown-item" type="button" data-value="AST" th:text="#{language.ast}"></button>
                    <button class="dropdown-item" type="button" data-value="AN" th:text="#{language.an}"></button>
                </div>
            </div>
        </div>
    </div>
</header>
