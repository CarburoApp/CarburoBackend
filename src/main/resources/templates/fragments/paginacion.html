<!-- templates/fragments/paginacion.html -->

<!-- Paginación -->
<nav th:fragment="paginacion" class="pagination" th:aria-label="#{paginacion.navegacion}"
     th:with="
        startPage=${page.number - 2 < 0 ? 0 : page.number - 2},
        endPage=${page.number + 2 > page.totalPages - 1 ? page.totalPages - 1 : page.number + 2}
        ">
    <ul class="pagination-list">

        <!-- Primera -->
        <li>
            <a class="pagination-link"
               href="?page=0"
               th:attr="aria-disabled=${page.first}"
               th:text="#{paginacion.primera}">
            </a>
        </li>

        <!-- Anterior -->
        <li>
            <a class="pagination-link"
               th:href="'?page=' + ${page.number - 1}"
               th:attr="aria-disabled=${page.first}">
                ←
            </a>
        </li>

        <!-- Ellipsis inicial -->
        <li th:if="${startPage > 0}">
            <span aria-hidden="true">…</span>
        </li>

        <!-- Páginas -->
        <li th:each="i : ${#numbers.sequence(startPage, endPage)}">
            <a class="pagination-link"
               th:href="'?page=' + ${i}"
               th:text="${i + 1}"
               th:classappend="${i == page.number} ? 'is-current'"
               th:attr="aria-current=${i == page.number ? 'page' : null}">
            </a>
        </li>



        <!-- Ellipsis final -->
        <li th:if="${endPage < page.totalPages - 1}">
            <span aria-hidden="true">…</span>
        </li>

        <!-- Siguiente -->
        <li>
            <a class="pagination-link"
               th:href="'?page=' + ${page.number + 1}"
               th:attr="aria-disabled=${page.last}">
                →
            </a>
        </li>

        <!-- Última -->
        <li>
            <a class="pagination-link"
               th:href="'?page=' + ${page.totalPages - 1}"
               th:attr="aria-disabled=${page.last}"
               th:text="#{paginacion.ultima}">
            </a>
        </li>
    </ul>
</nav>
