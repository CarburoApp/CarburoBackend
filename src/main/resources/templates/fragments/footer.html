<footer th:fragment="footer" class="site-footer">
    <a class="site-brand" th:href="@{/}">
        <img th:src="@{/images/Logo_comprimido.png}" alt=""/>
        <span th:text="#{app.name}"></span>
    </a>
    <p th:text="#{app.copy} + ' ' + ${#dates.format(#dates.createNow(), 'yyyy')}"></p>
    <nav th:aria-label="#{footer.nav.label}">
        <a th:href="@{/contacto}" th:text="#{contacto.title}"></a>
    </nav>
</footer>
