<!-- templates/fragments/head.html -->

<!--head-->
<th:block th:fragment="head">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta th:if="${_csrf != null}" name="_csrf" th:content="${_csrf.token}"/>
    <meta th:if="${_csrf != null}" name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- FAVICON -->
    <link rel="icon" type="image/ico" th:href="@{/images/Logo.ico}"/>

    <!-- Fuentes empleadas por las plantillas. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet"/>
    <link rel="preload" href="/images/icons.svg" as="image" type="image/svg+xml"/>

    <!-- CSS propio -->
    <link rel="stylesheet" th:href="@{/css/styles.css(v='20261114-icons')}"/>

    <!-- Scripts -->
    <script th:src="@{/script/language.js(v='20261114-language-popover')}"></script>
    <script th:src="@{/script/paginacion.js}"></script>

</th:block>
<!--/head-->
