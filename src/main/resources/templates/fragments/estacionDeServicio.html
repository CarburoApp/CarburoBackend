<!-- templates/fragments/estacionDeSercicio.html -->
<div th:if="${estacion != null}" th:fragment="card(estacion)">
    <a th:href="@{/estaciones-de-servicio/{id}(id=${estacion.id})}" class="block h-full">
        <div class="p-6">
            <!-- Card Header -->
            <div class="flex justify-between items-start mb-2">
                <div class="flex items-center gap-3">
                    <div class="size-8 bg-primary/10 rounded-full flex items-center justify-center text-primary">
                        <span class="material-symbols-outlined">local_gas_station</span>
                    </div>
                    <h3 class="text-xl font-bold text-text-main group-hover:text-primary transition-colors"
                        th:text="${estacion.getRotulo()}"></h3>
                </div>
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-[#f4ede7] text-text-secondary"
                      th:text="'ID: ' + ${estacion.getId()}"></span>
            </div>


            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <!-- Info Column -->
                <div class="flex flex-col gap-1.5">
                    <div class="flex items-start gap-2">
                        <span class="material-symbols-outlined text-text-secondary text-[20px] mt-0.5">location_on</span>
                        <div>
                            <p class="text-text-main font-medium" th:text="${estacion.getDireccion()}">
                                Dirección</p>
                            <p class="text-text-secondary text-sm"
                               th:text="${estacion.getLocalidad()} + ', ' + ${estacion.getCodigoPostal}">
                                Localidad, CP</p>
                            <p class="text-text-secondary text-xs mt-1 uppercase tracking-wide"
                               th:text="${estacion.getMunicipio().getDenominacion()} + ', ' + ${estacion.getProvincia().getDenominacion()}">
                                Provincia, Comunidad</p>
                        </div>
                    </div>
                </div>

                <!-- Status Column -->
                <div class="flex flex-col gap-1.5 items-start md:items-end text-left md:text-right">
                    <div class="flex items-center gap-1.5 font-bold text-lg"
                         th:classappend="${estacion.isAbierto()} ? 'text-green-600' : 'text-red-600'">
                        <span th:classappend="${estacion.isAbierto()} ? 'w-2.5 h-2.5 rounded-full bg-green-500 animate-pulse' : 'material-symbols-outlined text-[20px]'"
                              th:text="${estacion.isAbierto()} ? '' : 'block'">Estado</span>
                        <span th:text="${estacion.isAbierto()}    ? #{eess.estado.abierto}    : #{eess.estado.cerrado}"></span>
                    </div>
                    <div class="flex items-center gap-1.5 text-sm text-text-secondary">
                        <span class="material-symbols-outlined text-[18px]">schedule</span>
                        <span th:text="${estacion.getHorario()}"></span>
                    </div>
                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-blue-50 text-blue-700 mt-1"
                          th:text="${#messages.msg(estacion.getVenta().getCodigoMensaje())}"></span>

                </div>
            </div>

            <!-- Fuels Section -->
            <div class="border-t border-[#f4ede7] pt-4">
                <p class="text-xs font-bold text-text-secondary uppercase tracking-wider mb-3"
                   th:text="#{eess.list.combustible.precios}"></p>
                <div class="flex flex-wrap gap-3">
                    <div th:each="precioCombustible : ${estacion.getPreciosCombustiblesSorted()}"
                         class="flex flex-col items-center justify-center bg-[#fcfaf8] border border-[#e8dbce] rounded-lg p-3 min-w-[100px] hover:border-primary/50 transition-colors">
                                <span class="text-xs text-text-secondary mb-1"
                                      th:text="${#messages.msg('combustible.' + precioCombustible.getCombustible().getCodigo().toLowerCase())}"></span>
                        <span class="text-lg font-bold text-primary font-mono"
                              th:text="${#numbers.formatDecimal(precioCombustible.getPrecio(), 1, 'COMMA', 3, 'POINT')} + ' €'"></span>
                    </div>
                </div>
            </div>
        </div>
    </a>
</div>
