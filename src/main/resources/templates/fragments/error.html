<!DOCTYPE html>
<html th:fragment="page(code, title, description)" th:lang="${#locale.toLanguageTag()}">

<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + ${title}"></title>
    <meta name="robots" content="noindex">
</head>

<body class="site-body error-page">
<th:block th:replace="~{fragments/header :: header}"></th:block>
<main>
    <section class="error-card">
        <p class="error-code" aria-hidden="true" th:text="${code}"></p>
        <h1 th:text="${title}"></h1>
        <p th:text="${description}"></p>
        <nav class="error-navigation" th:attr="aria-label=#{error.navigation}">
            <a class="button button-primary" th:href="@{/}" th:text="#{error.home}"></a>
            <a class="button" th:href="@{/estaciones-de-servicio}" th:text="#{eess.list.title}"></a>
        </nav>
    </section>
</main>
<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
