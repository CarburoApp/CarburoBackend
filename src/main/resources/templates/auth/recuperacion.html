<!-- auth/recuperacion.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.recuperacion.title}"></title>

</head>

<body class="site-body auth-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-intro">
                <h1 th:text="#{auth.recuperacion.titulo}">¿Olvidada?</h1>
                <p th:text="#{auth.recuperacion.subtitulo}"></p>
            </div>
            <!--Mensaje de envío de correo exitoso-->
            <div class="form-success"
                 th:if="${exito}">
                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/images/icons.svg#info"></use>
                </svg>
                <p th:text="#{auth.recuperacion.exito}"></p>
            </div>
            <form method="post" th:action="@{/recuperacion}" th:object="${usuario}">
                <div>
                    <label for="email"
                           th:text="#{auth.correo.titulo}"></label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#mail"></use>
                        </svg>
                        <input id="email" autocomplete="email" th:placeholder="#{auth.correo.placeholder}"
                               type="email" th:field="*{correo}"/>
                    </div>
                </div>

                <p class="form-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <button class="button-primary"
                        type="submit">
                    <span th:text="#{auth.recuperacion.boton}"></span>
                </button>
            </form>
            <p class="auth-return-link">
                <a th:href="@{/login}">
                    <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#arrow-left"></use>
                    </svg>
                    <span th:text="#{auth.recuperacion.volver.inicio.sesion}"></span>
                </a>
            </p>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
