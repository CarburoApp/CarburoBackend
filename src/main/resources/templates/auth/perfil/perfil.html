<!-- auth/perfil.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <link rel="stylesheet" th:href="@{/css/tailwind/output.css}"/>
    <title th:text="#{app.name} + ' - ' + #{auth.perfil.title}"></title>

</head>

<body class="profile-page bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main class="flex-grow flex items-center justify-center py-2 px-4">
    <div class="max-w-xl w-full">
        <div class="flex justify-center gap-2 py-1 mb-8 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}" th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-main font-medium" th:href="@{/perfil}" th:text="#{auth.perfil.title}"></a>
        </div>
        <div class="bg-surface rounded-[2rem] border border-border-color p-8 md:p-12 shadow-xl shadow-primary/5 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
            <div class="mb-8 relative inline-block">
                <div class="size-32 rounded-full bg-primary/10 border-4 border-white shadow-md mx-auto flex items-center justify-center overflow-hidden">

                    <img th:if="${avatar_url != null && !avatar_url.isBlank()}"
                         th:src="${avatar_url}"
                         alt="Avatar de usuario"
                         class="w-full h-full object-cover">

                    <svg th:unless="${avatar_url != null && !avatar_url.isBlank()}"
                         class="icon text-6xl text-primary/40" focusable="false" width="24" height="24"
                         viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#user-round"></use>
                    </svg>

                </div>
                <button class="absolute bottom-0 right-0 size-10 bg-primary text-white rounded-full flex items-center justify-center border-4 border-white hover:scale-105 transition-transform shadow-sm">
                    <svg class="icon text-xl" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#camera"></use>
                    </svg>
                </button>
            </div>
            <!--Mensaje de cambio de contraseña exitoso-->
            <div class="mb-6 flex items-center gap-3 px-4 py-3 bg-red-50 border border-red-100 rounded-xl text-red-800 animate-in fade-in duration-500"
                 th:if="${param.passwordChanged}">
                <svg class="icon text-red-500 text-xl" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                     aria-hidden="true">
                    <use href="/images/icons.svg#info"></use>
                </svg>
                <p class="text-sm font-medium" th:text="#{auth.perfil.editar.contrasena.exitoso}"></p>
            </div>
            <div class="space-y-4 mb-10 text-left">
                <div class="appearance-none w-full rounded-lg border border-[#e8dbce] dark:border-[#4d3a29] bg-white dark:bg-[#221910] text-[#1c140d] dark:text-white py-3.5 pl-11 pr-10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    <p class="text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-1"
                       th:text="#{auth.perfil.nombre}"></p>
                    <p class="text-lg font-bold text-text-main" th:text="${nombre}"></p>
                </div>
                <div class="appearance-none w-full rounded-lg border border-[#e8dbce] dark:border-[#4d3a29] bg-white dark:bg-[#221910] text-[#1c140d] dark:text-white py-3.5 pl-11 pr-10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    <p class="text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-1"
                       th:text="#{auth.perfil.correo}"></p>
                    <p class="text-lg font-bold text-text-main" th:text="${correo}"></p>
                </div>
                <div class="appearance-none w-full rounded-lg border border-[#e8dbce] dark:border-[#4d3a29] bg-white dark:bg-[#221910] text-[#1c140d] dark:text-white py-3.5 pl-11 pr-10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all">
                    <p class="text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-1"
                       th:text="#{auth.perfil.provincia}"></p>
                    <div class="flex items-center justify-between">
                        <p class="text-lg font-bold text-text-main" th:text="${provincia}"></p>
                        <svg class="icon text-primary" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#map-pin"></use>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-8">
                <a class="flex items-center justify-center gap-2 h-11 px-4 rounded-xl border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold text-sm transition-all"
                   th:href="@{/perfil/editarNombre}">
                    <svg class="icon text-sm" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#pencil"></use>
                    </svg>
                    <span th:text="#{auth.perfil.nombre.modificar}"></span>
                </a>
                <a class="flex items-center justify-center gap-2 h-11 px-4 rounded-xl border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold text-sm transition-all"
                   th:href="@{/perfil/editarProvincia}">
                    <svg class="icon text-sm" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#map"></use>
                    </svg>
                    <span th:text="#{auth.perfil.provincia.modificar}"></span>
                </a>
                <a class="flex items-center justify-center gap-2 h-11 px-4 rounded-xl border-2 border-primary text-primary hover:bg-primary hover:text-white font-bold text-sm transition-all sm:col-span-2"
                   th:href="@{/perfil/change-password}">
                    <svg class="icon text-sm" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#lock"></use>
                    </svg>
                    <span th:text="#{auth.perfil.contrasena.cambiar}"></span>
                </a>
            </div>
            <form class="border-t border-border-color pt-8" th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button class="flex items-center justify-center gap-2 w-full h-12 rounded-xl bg-red-50 text-red-600 hover:bg-red-600 hover:text-white font-bold text-sm transition-all border border-red-100"
                        type="submit">
                    <svg class="icon text-xl" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#log-out"></use>
                    </svg>
                    <span th:text="#{auth.perfil.cerrar.sesion}"></span>
                </button>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
