<!-- auth/perfil/editarContrasena.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.perfil.editar.nombre.title}"></title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main class="flex-1 flex flex-col items-center py-12 px-4 bg-[#fcfaf8]">
    <div class="max-w-xl w-full">
        <div class="flex justify-center gap-2 py-1 mb-8 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}" th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/perfil}"
               th:text="#{auth.perfil.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-main font-medium" th:href="@{/perfil/change-password}"
               th:text="#{auth.perfil.editar.contrasena.title}"></a>
        </div>

        <div class="bg-surface rounded-[2rem] border border-border-color p-8 md:p-12 shadow-xl shadow-primary/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-text-main mb-2"
                    th:text="#{auth.perfil.editar.contrasena.titulo}"></h1>
                <p class="text-text-secondary text-sm" th:text="#{auth.perfil.editar.contrasena.subtitulo}"></p>
            </div>
            <div class="mb-8 p-4 bg-primary/10 border border-primary/20 rounded-2xl flex gap-4 items-start">
                <span class="material-symbols-outlined text-primary">shield</span>
                <p class="text-sm text-text-main font-medium leading-relaxed"
                   th:text="#{auth.perfil.editar.contrasena.info}">
                </p>
            </div>
            <form class="space-y-6" th:action="@{/change-password}" method="post" th:object="${usuario}">
                <div>
                    <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-2 px-1"
                           for="currentPassword" th:text="#{auth.perfil.editar.contrasena.actual.titulo}">
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary/60">lock_open</span>
                        <input class="w-full pl-12 pr-12 py-4 bg-background-light border border-border-color rounded-2xl text-lg font-bold text-text-main focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                               id="currentPassword" th:field="*{correo}" th:placeholder="#{auth.contrasena.placeholder}"
                               type="password"/>
                    </div>
                    <p th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"
                       class="text-red-600 text-xs mt-1"></p>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-2 px-1"
                           for="newPassword" th:text="#{auth.perfil.editar.contrasena.nueva.titulo}">
                    </label>
                    <div class="relative mb-4">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary/60">lock</span>
                        <input class="w-full pl-12 pr-12 py-4 bg-background-light border border-border-color rounded-2xl text-lg font-bold text-text-main focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                               id="newPassword" th:placeholder="#{auth.contrasena.placeholder}"
                               th:field="*{contrasena}" type="password"/>
                    </div>
                    <p th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"
                       class="text-red-600 text-xs mt-1"></p>
                    <!-- Password Requirements -->
                    <div class="bg-background-light dark:bg-[#221910] p-3 rounded-lg border border-[#e8dbce] dark:border-[#4d3a29]">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold text-text-secondary uppercase tracking-wider" th:text="#{auth.perfil.editar.contrasena.seguridad}"></span>
                        </div>
                        <p class="text-[#9c7349] dark:text-[#b59b7c] text-xs font-medium mb-1"
                           th:text="#{auth.contrasena.info}"></p>
                        <ul class="text-[#9c7349] dark:text-[#b59b7c] text-xs grid grid-cols-2 gap-x-2">
                            <li class="flex items-center gap-1">
                                <span class="material-symbols-outlined text-[10px] text-green-500">check_circle</span>
                                <span th:text="#{auth.contrasena.info.caracteres}"></span>
                            </li>
                            <li class="flex items-center gap-1">
                                <span class="material-symbols-outlined text-[10px] text-green-500">check_circle</span>
                                <span th:text="#{auth.contrasena.info.letra.numero}"></span>
                            </li>
                            <li class="flex items-center gap-1">
                                <span class="material-symbols-outlined text-[10px] text-green-500">check_circle</span>
                                <span th:text="#{auth.contrasena.info.simbolo}"></span>
                            </li>
                        </ul>
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-2 px-1"
                           for="confirmPassword" th:text="#{auth.perfil.editar.contrasena.confirmacion.titulo}">
                    </label>
                    <div class="relative">
                        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary/60">task_alt</span>
                        <input class="w-full pl-12 pr-12 py-4 bg-background-light border border-border-color rounded-2xl text-lg font-bold text-text-main focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                               id="confirmPassword" th:placeholder="#{auth.contrasena.placeholder}" type="password"
                               th:field="*{confirmacionContrasena}"/>
                    </div>
                    <p th:if="${#fields.hasErrors('confirmacionContrasena')}" th:errors="*{confirmacionContrasena}"
                       class="text-red-600 text-xs mt-1"></p>
                </div>
                <div class="flex flex-col gap-4 pt-4">
                    <button class="flex items-center justify-center gap-2 w-full h-14 rounded-xl bg-primary text-white hover:bg-primary/90 font-bold text-base transition-all shadow-lg shadow-primary/20"
                            type="submit">
                        <span class="material-symbols-outlined">sync_lock</span>
                        <span th:text="#{auth.perfil.editar.contrasena.boton.modificar}"></span>
                    </button>
                    <a class="flex items-center justify-center w-full h-12 rounded-xl text-text-secondary hover:text-text-main hover:bg-background-light font-bold text-sm transition-all"
                       th:href="@{/perfil}" th:text="#{auth.perfil.editar.contrasena.boton.cancelar}">
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
