<!-- auth/perfil/editarProvinciaFavorita.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.perfil.editar.provincia.title}"></title>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main class="flex-grow flex items-center justify-center py-2 px-4">
    <div class="max-w-xl w-full">
        <div class="flex justify-center gap-2 py-1 mb-8 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}" th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/perfil}"
               th:text="#{auth.perfil.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-main font-medium" th:href="@{/perfil/editarProvincia}"
               th:text="#{auth.perfil.editar.provincia.title}"></a>
        </div>
        <div class="bg-surface rounded-[2rem] border border-border-color p-8 md:p-12 shadow-xl shadow-primary/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-text-main mb-2"
                    th:text="#{auth.perfil.editar.provincia.titulo}"></h1>
                <p class="text-text-secondary text-sm" th:text="#{auth.perfil.editar.provincia.subtitulo}"></p>
            </div>
            <form class="space-y-6" method="post" th:action="@{/perfil/editarProvincia}" th:object="${usuario}">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-2 px-1"
                       for="filtro_provincia" th:text="#{auth.perfil.editar.provincia.provincia.titulo}"> </label>
                <div class="relative group">
                    <span class="absolute left-3.5 top-1/2 -translate-y-1/2 material-symbols-outlined text-[#9c7349]">search</span>
                    <select class="appearance-none w-full rounded-lg border border-[#e8dbce] dark:border-[#4d3a29] bg-white dark:bg-[#221910] text-[#1c140d] dark:text-white py-3.5 pl-11 pr-10 focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all"
                            id="filtro_provincia" th:field="*{provinciaFavorita}">
                        <option th:each="provincia : ${provincias}" th:value="${provincia.getId()}"
                                th:text="${provincia.getDenominacion()}"
                                th:selected="${provincia.getId() == usuario.getProvinciaFavorita()}"></option>
                    </select>
                    <span class="absolute right-3.5 top-1/2 -translate-y-1/2 material-symbols-outlined text-[#9c7349] pointer-events-none">expand_more</span>
                </div>
                <p th:if="${#fields.hasErrors('provinciaFavorita')}" th:errors="*{provinciaFavorita}"
                   class="text-red-600 text-xs mt-1"></p>
                <div class="flex flex-col gap-4 pt-4">
                    <button class="flex items-center justify-center gap-2 w-full h-14 rounded-xl bg-primary text-white hover:bg-primary/90 font-bold text-base transition-all shadow-lg shadow-primary/20"
                            type="submit">
                        <span class="material-symbols-outlined">save</span>
                        <span th:text="#{auth.perfil.editar.provincia.boton.modificar}"></span>
                    </button>
                    <a class="flex items-center justify-center w-full h-12 rounded-xl text-text-secondary hover:text-text-main hover:bg-background-light font-bold text-sm transition-all"
                       th:href="@{/perfil}" th:text="#{auth.perfil.editar.provincia.boton.cancelar}">
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
