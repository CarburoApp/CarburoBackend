<!-- auth/login.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.perfil.editar.nombre.title}"></title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main class="flex-grow flex items-center justify-center py-2 px-4">
    <div class="max-w-xl w-full">
        <div class="flex justify-center gap-2 py-1 mb-8 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}" th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/perfil}"
               th:text="#{auth.perfil.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-main font-medium" th:href="@{/perfil/editarNombre}"
               th:text="#{auth.perfil.editar.nombre.title}"></a>
        </div>
        <div class="bg-surface rounded-[2rem] border border-border-color p-8 md:p-12 shadow-xl shadow-primary/5 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-2 bg-primary"></div>
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-text-main mb-2" th:text="#{auth.perfil.editar.nombre.titulo}"></h1>
                <p class="text-text-secondary text-sm" th:text="#{auth.perfil.editar.nombre.subtitulo}"></p>
            </div>
            <form class="space-y-6" method="post" th:action="@{/perfil/editarNombre}" th:object="${usuario}">
                <label class="block text-[10px] font-bold text-text-secondary uppercase tracking-[0.1em] mb-2 px-1"
                       for="fullName" th:text="#{auth.perfil.editar.nombre.nombre.titulo}"> </label>
                <div class="relative">
                    <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-text-secondary/60">person</span>
                    <input class="w-full pl-12 pr-4 py-4 bg-background-light border border-border-color rounded-2xl text-lg font-bold text-text-main focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all"
                           id="fullName" th:placeholder="#{auth.perfil.editar.nombre.nombre.placeholder}" type="text"
                           th:field="*{nombre}" th:value="${usuario.nombre}" />
                </div>
                <p th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}" class="text-red-600 text-xs mt-1"></p>
                <div class="flex flex-col gap-4 pt-4">
                    <button class="flex items-center justify-center gap-2 w-full h-14 rounded-xl bg-primary text-white hover:bg-primary/90 font-bold text-base transition-all shadow-lg shadow-primary/20"
                            type="submit">
                        <span class="material-symbols-outlined">save</span>
                        <span th:text="#{auth.perfil.editar.nombre.boton.modificar}"></span>
                    </button>
                    <a class="flex items-center justify-center w-full h-12 rounded-xl text-text-secondary hover:text-text-main hover:bg-background-light font-bold text-sm transition-all"
                       th:href="@{/perfil}" th:text="#{auth.perfil.editar.nombre.boton.cancelar}">
                    </a>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
