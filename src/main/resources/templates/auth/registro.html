<!-- auth/registro.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.registro.title}"></title>


    <script src="/script/auth/google.js"></script>
    <script src="/script/auth/password.js"></script>

</head>

<body class="site-body auth-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main>
    <div class="auth-card registration-card">
        <!-- Headline & MetaText -->
        <div class="auth-intro">
            <h1 th:text="#{auth.registro.titulo}">Únete a Carburo</h1>
            <p th:text="#{auth.registro.subtitulo}"></p>
        </div>

        <!-- Auth de google para inicio de sesión-->
        <div class="auth-social">
            <button type="button"
                    onclick="iniciarSesionConGoogle()"
                    class="google-login"
                    id="gSignInWrapper">
                <img class="google-logo" th:src="@{/images/google-logo.svg}" width="20" height="20" alt=""/>
                <span th:text="#{auth.google.continuar}">Continuar con Google</span>
            </button>

            <div class="auth-divider"><span th:text="#{auth.registro.alternativa.titulo}"></span></div>
        </div>

        <!-- Registration Form -->
        <form class="registration-form" th:action="@{/registro}" method="post" th:object="${usuario}">
            <!-- Nombre Completo -->
            <div class="form-field">
                <label for="name_input"
                       th:text="#{auth.registro.nombre.titulo}"></label>
                <div class="input-with-icon">
                    <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#user-round"></use>
                    </svg>
                    <input id="name_input" autocomplete="name" th:field="*{nombre}"
                           th:placeholder="#{auth.registro.nombre.placeholder}"
                           type="text"/>
                </div>
                <p class="form-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></p>
            </div>
            <!-- Correo Electrónico -->
            <div class="form-field">
                <label for="email_input"
                       th:text="#{auth.correo.titulo}"></label>
                <div class="input-with-icon">
                    <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#mail"></use>
                    </svg>
                    <input th:field="*{correo}" autocomplete="email" th:placeholder="#{auth.correo.placeholder}"
                           type="email"
                           id="email_input"/>
                </div>
                <p class="field-help">
                    <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#info"></use>
                    </svg>
                    <span th:text="#{auth.registro.correo.informacion}"></span>
                </p>
                <p class="form-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
            </div>
            <!-- Contraseña -->
            <div class="password-field-pair">
                <div class="form-field">
                    <label for="contrasena_input"
                           th:text="#{auth.contrasena.titulo}"></label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#lock"></use>
                        </svg>
                        <input id="contrasena_input" autocomplete="new-password" th:field="*{contrasena}"
                               th:placeholder="#{auth.contrasena.placeholder}" type="password"/>
                        <button type="button" class="password-toggle" data-password-toggle
                                aria-controls="contrasena_input"
                                th:attr="aria-label=#{auth.contrasena.mostrar},data-show-label=#{auth.contrasena.mostrar},data-hide-label=#{auth.contrasena.ocultar}">
                            <svg data-eye-open class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#eye"></use>
                            </svg>
                            <svg data-eye-closed class="icon is-hidden" focusable="false" width="24" height="24"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#eye-off"></use>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-field">
                    <label for="contrasena_confirmacion_input"
                           th:text="#{auth.registro.contrasena.nueva.titulo}"></label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#lock"></use>
                        </svg>
                        <input id="contrasena_confirmacion_input" autocomplete="new-password"
                               th:field="*{confirmacionContrasena}"
                               th:placeholder="#{auth.contrasena.placeholder}" type="password"/>
                        <button type="button" class="password-toggle" data-password-toggle
                                aria-controls="contrasena_confirmacion_input"
                                th:attr="aria-label=#{auth.contrasena.mostrar},data-show-label=#{auth.contrasena.mostrar},data-hide-label=#{auth.contrasena.ocultar}">
                            <svg data-eye-open class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#eye"></use>
                            </svg>
                            <svg data-eye-closed class="icon is-hidden" focusable="false" width="24" height="24"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#eye-off"></use>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
            <p class="form-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></p>
            <p class="form-error" th:if="${#fields.hasErrors('confirmacionContrasena')}"
               th:errors="*{confirmacionContrasena}"></p>
            <!-- Password Requirements -->
            <div class="password-requirements">
                <p class="section-label" th:text="#{auth.contrasena.info}"></p>
                <ul>
                    <li>
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#circle-check"></use>
                        </svg>
                        <span th:text="#{auth.contrasena.info.letra.numero}"></span>
                    </li>
                    <li>
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#circle-check"></use>
                        </svg>
                        <span th:text="#{auth.contrasena.info.caracteres}"></span>
                    </li>
                </ul>
            </div>
            <!-- Divider Personalization -->
            <div class="auth-divider">
                <span class="section-label"
                      th:text="#{auth.registro.personalizacion.titulo}"></span>
            </div>
            <!-- Infotip Personalización -->
            <div class="form-info">
                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/images/icons.svg#lightbulb"></use>
                </svg>
                <p>
                    <span th:text="#{auth.registro.personalizacion.informacion1}"></span>
                    <strong th:text="#{auth.registro.personalizacion.informacion2}"></strong>
                    <span th:text="#{auth.registro.personalizacion.informacion3}"></span>
                </p>
            </div>
            <!-- Provincia Selector -->
            <div class="form-field">
                <label th:text="#{auth.registro.provincia.favorita.titulo}" for="filtro_provincia"></label>
                <div class="input-with-icon select-with-icon">
                    <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#search"></use>
                    </svg>
                    <select id="filtro_provincia" th:field="*{provinciaFavorita}">
                        <option th:value="0" th:text="#{auth.registro.provincia.favorita.defecto}"></option>
                        <option th:each="provincia : ${provincias}" th:value="${provincia.getId()}"
                                th:text="${provincia.getDenominacion()}"
                                th:selected="${provincia.getId() == usuario.getProvinciaFavorita()}"></option>
                    </select>
                    <svg class="icon select-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                         aria-hidden="true">
                        <use href="/images/icons.svg#chevron-down"></use>
                    </svg>
                </div>
                <p class="form-error" th:if="${#fields.hasErrors('provinciaFavorita')}"
                   th:errors="*{provinciaFavorita}"></p>
            </div>

            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <button class="button-primary"
                    type="submit" th:text="#{auth.registro.boton}"></button>
        </form>
        <p class="auth-alternative">
                <span th:text="#{auth.registro.inicio.sesion}"></span>
            <a th:href="@{/login}"
                   th:text="#{auth.registro.inicio.sesion.boton}"></a>
            </p>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
