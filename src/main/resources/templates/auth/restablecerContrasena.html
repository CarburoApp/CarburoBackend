<!-- auth/restablecerContrasena.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.restablecer.contrasena.title}"></title>
    <script src="/script/auth/password.js" defer></script>
</head>

<body class="site-body auth-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-intro">
                <h1 th:text="#{auth.restablecer.contrasena.titulo}"></h1>
                <p th:text="#{auth.restablecer.contrasena.subtitulo}"></p>
            </div>
            <!--Mensaje de cambio de contraseña exitoso-->
            <form th:action="@{/auth/reset-password}"
                  method="post" th:object="${usuario}">

                <input type="hidden" id="token" th:field="*{token}">

                <div>
                    <label 
                           for="newPassword" th:text="#{auth.restablecer.contrasena.nueva.titulo}">
                    </label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#lock"></use>
                        </svg>
                        <input id="newPassword" autocomplete="new-password"
                               th:placeholder="#{auth.contrasena.placeholder}"
                               th:field="*{contrasena}" type="password"/>
                        <button type="button" class="password-toggle" data-password-toggle
                                aria-controls="newPassword"
                                th:attr="aria-label=#{auth.contrasena.mostrar},data-show-label=#{auth.contrasena.mostrar},data-hide-label=#{auth.contrasena.ocultar}">
                            <svg data-eye-open class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#eye"></use>
                            </svg>
                            <svg data-eye-closed class="icon is-hidden" focusable="false" width="24" height="24"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#eye-off"></use>
                            </svg>
                        </button>
                    </div>
                    <p class="form-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></p>

                    <div>
                        <div>
                            <span class="section-label" th:text="#{auth.perfil.editar.contrasena.seguridad}"></span>
                        </div>
                        <p th:text="#{auth.contrasena.info}"></p>
                        <ul>
                            <li>
                                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                     aria-hidden="true">
                                    <use href="/images/icons.svg#circle-check"></use>
                                </svg>
                                <span th:text="#{auth.contrasena.info.caracteres}"></span>
                            </li>
                            <li>
                                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                     aria-hidden="true">
                                    <use href="/images/icons.svg#circle-check"></use>
                                </svg>
                                <span th:text="#{auth.contrasena.info.letra.numero}"></span>
                            </li>
                        </ul>
                    </div>
                </div>

                <div>
                    <label 
                           for="confirmPassword" th:text="#{auth.restablecer.contrasena.confirmacion.titulo}">
                    </label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#badge-check"></use>
                        </svg>
                        <input id="confirmPassword" autocomplete="new-password"
                               th:placeholder="#{auth.contrasena.placeholder}" type="password"
                               th:field="*{confirmacionContrasena}"/>
                        <button type="button" class="password-toggle" data-password-toggle
                                aria-controls="confirmPassword"
                                th:attr="aria-label=#{auth.contrasena.mostrar},data-show-label=#{auth.contrasena.mostrar},data-hide-label=#{auth.contrasena.ocultar}">
                            <svg data-eye-open class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#eye"></use>
                            </svg>
                            <svg data-eye-closed class="icon is-hidden" focusable="false" width="24" height="24"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#eye-off"></use>
                            </svg>
                        </button>
                    </div>
                    <p class="form-error" th:if="${#fields.hasErrors('confirmacionContrasena')}"
                       th:errors="*{confirmacionContrasena}"></p>
                </div>

                <div>
                    <button class="button-primary"
                            type="submit">
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#key-round"></use>
                        </svg>
                        <span th:text="#{auth.restablecer.contrasena.boton.enviar}"></span>
                    </button>
                </div>
            </form>
            <p class="auth-return-link">
                <a th:href="@{/login}">
                    <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#arrow-left"></use>
                    </svg>
                    <span th:text="#{auth.recuperacion.volver.inicio.sesion}"></span>
                </a>
            </p>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script th:src="@{/script/auth/extractRecoverPathInformation.js}"></script>

</body>
</html>
