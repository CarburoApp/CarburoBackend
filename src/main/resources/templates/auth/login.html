<!-- auth/login.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{auth.login.title}"></title>

    <script src="/script/auth/google.js"></script>
    <script src="/script/auth/password.js"></script>

</head>

<body class="site-body auth-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main>
    <div class="auth-layout">
        <div class="auth-card">
            <div class="auth-intro">
                <h1 th:text="#{auth.login.titulo}">Bienvenido</h1>
                <p th:text="#{auth.login.subtitulo}"></p>
            </div>
            <!--Mensaje de cierre de sesión exitoso-->
            <div class="form-success"
                 th:if="${param.logout}">
                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/images/icons.svg#info"></use>
                </svg>
                <p th:text="#{auth.logout.exitoso}"></p>
            </div>

            <div class="form-success"
                 th:if="${param.passwordChanged}">
                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/images/icons.svg#info"></use>
                </svg>
                <p th:text="#{auth.recover.exitoso}"></p>
            </div>

            <form method="post" th:action="@{/login}" th:object="${usuario}">
                <div>
                    <label for="email"
                           th:text="#{auth.correo.titulo}"></label>
                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#mail"></use>
                        </svg>
                        <input id="email" autocomplete="email" th:placeholder="#{auth.correo.placeholder}"
                               type="email" th:field="*{correo}"/>
                    </div>
                </div>
                <p class="form-error" th:if="${#fields.hasErrors('correo')}" th:errors="*{correo}"></p>
                <div>
                    <label for="password-input"
                           th:text="#{auth.contrasena.titulo}"> </label>

                    <div class="input-with-icon">
                        <svg class="icon input-icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#lock"></use>
                        </svg>
                        <input id="password-input" autocomplete="current-password" type="password"
                               class="password-input"
                               th:placeholder="#{auth.contrasena.placeholder}" th:field="*{contrasena}"
                               th:attr="data-show-label=#{auth.contrasena.mostrar},
                               data-hide-label=#{auth.contrasena.ocultar},
                               data-placeholder-hidden=#{auth.contrasena.placeholder},
                               data-placeholder-visible=#{auth.contrasena.placeholder.ejemplo}"/>


                        <button type="button"
                                class="password-toggle"
                                data-password-toggle
                                aria-controls="password-input"
                                th:attr="aria-label=#{auth.contrasena.mostrar},data-show-label=#{auth.contrasena.mostrar},data-hide-label=#{auth.contrasena.ocultar}">
                            <svg data-eye-open class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#eye"></use>
                            </svg>
                            <svg data-eye-closed class="icon is-hidden" focusable="false" width="24" height="24"
                                 viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#eye-off"></use>
                            </svg>
                        </button>
                    </div>
                    <p class="form-error" th:if="${#fields.hasErrors('contrasena')}" th:errors="*{contrasena}"></p>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                </div>

                <div class="form-utility">
                    <a th:href="@{/recuperacion}"
                       th:text="#{auth.login.contrasena.olvidada}"></a>
                </div>
                <button class="button-primary" type="submit" th:text="#{auth.login.boton}"></button>
            </form>
            <div class="auth-divider"><span th:text="#{auth.login.sesion.google}"></span></div>

            <button type="button"
                    onclick="iniciarSesionConGoogle()"
                    class="google-login"
                    id="gSignInWrapper">
                <img class="google-logo" th:src="@{/images/google-logo.svg}" width="20" height="20" alt=""/>
                <span th:text="#{auth.google.continuar}">Continuar con Google</span>
            </button>

            <p class="auth-alternative">
                <span th:text="#{auth.login.registro.alternativa}"></span>
                <a th:href="@{/registro}" th:text="#{auth.login.registro.boton}"></a>
            </p>
        </div> </div> </main>

<footer th:replace="~{fragments/footer :: footer}"></footer>

<script>
    (function() {
        if (window.location.hash && window.location.hash.includes('access_token=')) {
            const queryParams = window.location.hash.replace('#', '?');
            window.location.href = window.location.origin + window.location.pathname + queryParams;
        }
    })();
</script>

</body>
</html>
