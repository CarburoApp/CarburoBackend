<!doctype html>
<html th:lang="${#locale.toLanguageTag()}">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{eess.list.title}"></title>
</head>

<body class="site-body stations-page">
<!-- Cabecera -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<div th:attrappend="data-locale=${#locale.toLanguageTag()}"
     id="app"
     class="stations-layout"
     v-cloak
     th:attr="data-api-key=${publicApiKey}
                ,data-api-url=${publicApiUrl}
                ,data-introduccion=#{eess.list.introduccion},data-primera=#{paginacion.primera},data-ultima=#{paginacion.ultima}">
    <div class="filter-overlay"
         :class="{ visible: filtrosVisibles }"
         @click="filtrosVisibles = false"
         aria-hidden="true">
    </div>

    <!-- Panel de filtros -->
    <aside id="asideFiltros"
           ref="panelFiltros"
           class="filters-panel"
           :class="{ abierto: filtrosVisibles }"
           :style="{ '--filters-panel-height': alturaPanelFiltros + 'px' }"
           th:aria-label="#{eess.list.filtros}">
        <div>
            <!-- Cabecera de filtros -->
            <header>
                <svg class="icon"
                     focusable="false"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     aria-hidden="true">
                    <use href="/images/icons.svg#sliders-horizontal"></use>
                </svg>

                <h2 id="filters-title" th:text="#{eess.list.filtros}"></h2>

                <button type="button"
                        class="filter-toggle filter-close"
                        @click="filtrosVisibles = false"
                        th:aria-label="#{eess.list.filtros.cerrar}">
                    ×
                </button>
            </header>

            <form aria-labelledby="filters-title" @submit.prevent>
                <!-- Búsqueda por texto -->
                <div>
                    <label for="filtro_buscador" th:text="#{eess.list.filtros.buscar}"></label>
                    <div class="filter-search-control">
                        <div>
                            <svg class="icon"
                                 focusable="false"
                                 width="24"
                                 height="24"
                                 viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#search"></use>
                            </svg>
                        </div>

                        <input id="filtro_buscador"
                               type="text"
                               v-model="filtros.busqueda"
                               th:placeholder="#{eess.list.filtros.buscar.placeholder}"/>
                    </div>
                </div>

                <!-- Filtros de ubicación -->
                <fieldset>
                    <legend class="filter-section-title" th:text="#{eess.list.filtros.ubicacion}"></legend>

                    <label for="filtro_ccaa" th:text="#{eess.list.filtros.ubicacion.ccaa}"></label>

                    <select id="filtro_ccaa"
                            v-model="filtros.ccaa"
                            @change="cambioCCAA"
                            :disabled="cargandoComunidades">
                        <option value="0" th:text="#{eess.list.filtros.indiferente}"></option>
                        <option v-for="comunidad in comunidades"
                                :key="comunidad.id"
                                :value="String(comunidad.id)">
                            {{ comunidad.denominacion }}
                        </option>
                    </select>

                    <label for="filtro_provincia" th:text="#{eess.list.filtros.ubicacion.provincia}"></label>
                    <select id="filtro_provincia"
                            v-model="filtros.provincia"
                            @change="cambioProvincia"
                            :disabled="filtros.ccaa === '0' || cargandoProvincias">
                        <option value="0" th:text="#{eess.list.filtros.indiferente}"></option>
                        <option v-for="provincia in provincias"
                                :key="provincia.id"
                                :value="String(provincia.id)">
                            {{ provincia.denominacion }}
                        </option>
                    </select>

                    <label for="filtro_municipio" th:text="#{eess.list.filtros.ubicacion.municipio}"></label>
                    <select id="filtro_municipio"
                            v-model="filtros.municipio"
                            :disabled="filtros.provincia === '0' || cargandoMunicipios">
                        <option th:value="0" th:text="#{eess.list.filtros.indiferente}"></option>
                        <option v-for="municipio in municipiosProvincia"
                                :key="municipio.id"
                                :value="String(municipio.id)">
                            {{ municipio.denominacion }}
                        </option>
                    </select>
                </fieldset>

                <!-- Ordenación -->
                <div>
                    <label for="ordenacion" th:text="#{eess.list.filtros.ordenar.label}"></label>

                    <select id="ordenacion" v-model="filtros.orden">
                        <option value="price_asc" th:text="#{eess.list.filtros.orden.precio.asc}"></option>

                        <option value="price_desc" th:text="#{eess.list.filtros.orden.precio.desc}"></option>

                        <option value="name_asc" th:text="#{eess.list.filtros.orden.alfabetico.asc}"></option>

                        <option value="name_desc" th:text="#{eess.list.filtros.orden.alfabetico.desc}"></option>
                    </select>
                </div>

                <!-- Estado de apertura -->
                <fieldset>
                    <legend class="filter-section-title" th:text="#{eess.list.filtros.estado}"></legend>

                    <div id="filtro_estado"
                         class="filter-state"
                         role="group"
                         th:attr="aria-label=#{eess.list.filtros.estado}">
                        <!-- ABIERTO -->
                        <button type="button"
                                @click="filtros.estado = EstadoApertura.ABIERTO"
                                class="filter-state-option"
                                :class="filtros.estado === EstadoApertura.ABIERTO
                                    ? 'is-selected'
                                    : ''"
                                th:text="#{eess.estado.abierto}">

                        </button>

                        <!-- CERRADO -->
                        <button type="button"
                                @click="filtros.estado = EstadoApertura.CERRADO"
                                class="filter-state-option"
                                :class="filtros.estado === EstadoApertura.CERRADO
                                    ? 'is-selected'
                                    : ''"
                                th:text="#{eess.estado.cerrado}">

                        </button>

                        <!-- INDEFERENTE -->
                        <button type="button"
                                @click="filtros.estado = EstadoApertura.INDEFERENTE"
                                class="filter-state-option"
                                :class="filtros.estado === EstadoApertura.INDEFERENTE
                                    ? 'is-selected'
                                    : ''"
                                th:text="#{eess.list.estado.indiferente}">

                        </button>
                    </div>
                </fieldset>

                <!-- Combustibles -->
                <fieldset>
                    <legend class="filter-section-title" th:text="#{eess.list.filtros.combustibles}"></legend>
                    <div id="filtro_combustibles_disponibles" class="fuel-filter-list">
                        <div>
                            <label v-for="combustible in combustiblesDisponibles" :key="combustible.id">
                                <input type="checkbox"
                                       :value="String(combustible.id)"
                                       v-model="filtros.combustibles"/>
                                <span>{{ combustible.denominacion }}</span>
                            </label>
                        </div>
                    </div>
                </fieldset>

                <!-- Marca -->
                <div>
                    <label for="filtro_marca" th:text="#{eess.list.filtros.marca}"></label>
                    <select id="filtro_marca" v-model="filtros.marca">
                        <option value="0NOTSELECTED" th:text="#{eess.list.filtros.indiferente}"></option>

                        <option v-for="marca in marcas" :key="marca" :value="marca">{{ marca }}</option>
                    </select>
                </div>
            </form>
        </div>
    </aside>

    <!-- Resultados -->
    <main class="stations-results">
        <!-- Migas de pan -->
        <nav class="breadcrumbs" th:aria-label="#{breadcrumb.label}">
            <a th:href="@{/}" th:text="#{home.title}"></a>
            <span aria-hidden="true">/</span>
            <span aria-current="page" th:text="#{eess.list.title}"></span>
        </nav>

        <!-- Cabecera del listado -->
        <div class="stations-toolbar">
            <div>
                <h1 th:text="#{eess.list.title}"></h1>
                <p>{{ textoContador }}</p>
            </div>

            <!-- Abrir filtros en móvil -->
            <button type="button"
                    class="filter-toggle"
                    @click="filtrosVisibles = !filtrosVisibles"
                    :aria-expanded="filtrosVisibles"
                    aria-controls="asideFiltros">
                <svg class="icon"
                     focusable="false"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     aria-hidden="true">
                    <use href="/images/icons.svg#sliders-horizontal"></use>
                </svg>

                <span th:text="#{eess.list.filtros}"></span>
            </button>
        </div>

        <h2 class="visually-hidden" th:text="#{eess.list.resultados}"></h2>

        <!-- Listado de estaciones -->
        <th:block th:replace="~{fragments/eess/estaciones-listado-vue :: listado}"></th:block>

        <!-- Paginación -->
        <div v-if="totalPaginas() > 1"
             id="paginacion"
             class="pagination"
             th:attr="data-primera=#{paginacion.primera},data-ultima=#{paginacion.ultima}">
            <ul class="pagination-list">
                <li>
                    <button type="button"
                            @click="irAPagina(1)"
                            :disabled="paginaActual === 1"
                            class="pagination-link">
                        {{ textoPrimera }}
                    </button>
                </li>

                <li>
                    <button type="button"
                            @click="paginaAnterior"
                            :disabled="paginaActual === 1"
                            class="pagination-link">
                        ←
                    </button>
                </li>

                <li v-if="paginasVisibles()[0] > 1">
                    <span aria-hidden="true">…</span>
                </li>

                <li v-for="pagina in paginasVisibles()" :key="pagina">
                    <button type="button"
                            @click="irAPagina(pagina)"
                            class="pagination-link"
                            :class="pagina === paginaActual ? 'is-current' : ''"
                            :aria-current="pagina === paginaActual ? 'page' : null">
                        {{ pagina }}
                    </button>
                </li>

                <li v-if="paginasVisibles()[paginasVisibles().length - 1] < totalPaginas()">
                    <span aria-hidden="true">…</span>
                </li>

                <li>
                    <button type="button"
                            @click="paginaSiguiente"
                            :disabled="paginaActual === totalPaginas()"
                            class="pagination-link">
                        →
                    </button>
                </li>

                <li>
                    <button type="button"
                            @click="irAPagina(totalPaginas())"
                            :disabled="paginaActual === totalPaginas()"
                            class="pagination-link">
                        {{ textoUltima }}
                    </button>
                </li>
            </ul>
        </div>
    </main>
</div>

<!-- Pie de página -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<script type="module" th:src="@{/assets/estaciones-de-servicio.js}"></script>
</body>
</html>
