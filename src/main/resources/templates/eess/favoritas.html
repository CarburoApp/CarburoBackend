<!-- eess/favoritas.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{eess.list.title}"></title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #9ca3af;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<div class="flex flex-1 w-full max-w-[1000px] mx-auto px-4 py-6 md:px-8 flex-col">

    <!-- Breadcrumbs -->
    <div class="flex flex-wrap gap-2 py-2 mb-4 text-sm">
        <a class="text-text-secondary font-medium hover:underline" th:href="@{/}"
           th:text="#{home.title}"></a>
        <span class="text-text-secondary font-medium">/</span>
        <a class="text-text-secondary font-medium hover:underline" th:href="@{/perfil}"
           th:text="#{auth.perfil.title}"></a>
        <span class="text-text-secondary font-medium">/</span>
        <a class="text-text-main font-medium" th:href="@{/perfil/estacionesDeServicio/favoritas}"
           th:text="#{eess.favoritas.title}"></a>
    </div>
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-8 border-b border-border-color pb-4">
        <div>
            <h1 class="text-text-main text-3xl font-bold leading-tight mb-2" th:text="#{eess.favoritas.titulo}"></h1>
            <p class="text-text-secondary text-sm" th:text="#{eess.favoritas.subtitulo}"></p>
        </div>
    </div>
    <main class="flex-1 flex flex-col min-w-0">
        <div class="flex flex-col gap-4">
            <div class="bg-primary/5 border-2 border-dashed border-primary/30 rounded-xl p-6 flex flex-col items-center justify-center text-center gap-2">
                <div class="size-14 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-2"
                     th:if="${#lists.isEmpty(eess)}">
                    <span class="material-symbols-outlined text-4xl">favorite</span>
                </div>
                <div>
                    <h3 class="text-xl font-bold text-text-main" th:text="#{eess.favoritas.anadir.titulo}"></h3>
                    <p class="text-text-secondary mt-1 max-w-md" th:text="#{eess.favoritas.anadir.subtitulo}"
                       th:if="${#lists.isEmpty(eess)}"></p>
                </div>
                <a th:href="@{/estacionesDeServicio}"
                        class="flex min-w-[240px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-12 px-6 bg-primary hover:bg-primary/90 transition-colors text-white text-sm font-bold leading-normal tracking-[0.015em] shadow-sm">
                    <span class="truncate" th:text="#{eess.favotitas.boton.buscar}"></span>
                </a>
            </div>
            <!-- Station Card -->
            <article th:each="estacion : ${eess}"
                     th:insert="~{fragments/estacionDeServicio :: card(estacion=${estacion})}"
                     class="bg-surface rounded-xl border border-[#e8dbce] shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden group"
                     th:classappend="${estacion.isAbierto()} ? '' : 'opacity-90'">
            </article>
        </div>
    </main>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
