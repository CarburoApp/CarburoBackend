<!-- eess/estacionDeServicio.html -->
<!DOCTYPE html>
<html lang="es" class="light" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + ${estacion.getRotulo()}"></title>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<div class="flex flex-1 w-full max-w-[1400px] mx-auto px-4 py-6 md:px-8 gap-8">
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Breadcrumbs -->
        <div class="flex flex-wrap gap-2 py-2 mb-6 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}"
               th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/estacionesDeServicio}"
               th:text="#{eess.list.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline"
               th:text="${estacion.getProvincia().getDenominacion()}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <span class="text-text-main font-medium" th:text="|${estacion.rotulo} (#{eess.id}${estacion.id})|"></span>
        </div>

        <div class="bg-surface rounded-xl border border-[#e8dbce] p-6 md:p-8 shadow-sm mb-8 relative overflow-visible">
            <!-- Botón de me gusta-->
            <form th:fragment="botonFavorita(estacion, favorita)" method="post" sec:authorize="isAuthenticated()"
                  th:action="@{/perfil/estacionesDeServicio/favoritas/{id}(id=${estacion.id})}">
                <button type="submit"
                        class="absolute -top-6 -right-1 md:right-8 w-12 h-12 md:w-14 md:h-14
                   rounded-full flex items-center justify-center shadow-lg hover:shadow-xl transition-all group z-20
                   border border-red-400 bg-white"
                        th:attr="aria-label=#{${favorita}? 'eess.favoritas.boton.retirar': 'eess.favoritas.boton.anadir'},
                        title=#{${favorita}? 'eess.favoritas.boton.retirar': 'eess.favoritas.boton.anadir'}">
                    <span class="material-symbols-outlined text-3xl transition-transform group-hover:scale-110"
                          th:classappend="${favorita} ? 'favorita-activa' : 'favorita-inactiva'">
                        favorite
                    </span>
                </button>
            </form>
            <div class="flex flex-col md:flex-row justify-between items-start gap-6 relative z-10">
                <div class="flex items-start gap-5">
                    <div class="size-16 bg-primary/10 rounded-2xl flex items-center justify-center text-primary shrink-0">
                        <span class="material-symbols-outlined text-[36px]">local_gas_station</span>
                    </div>
                    <div>
                        <div class="flex items-center gap-3 mb-1">
                            <h1 class="text-text-main text-3xl font-bold leading-tight"
                                th:text="${estacion.getRotulo()}">Rotulo</h1>
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-xs font-bold bg-[#f4ede7] text-text-secondary tracking-wide"
                                  th:text="|#{eess.id}${estacion.id}|">>
                            </span>
                        </div>
                        <div class="flex items-center gap-1 text-text-secondary mb-3">
                            <div class="flex items-start gap-2 text-text-secondary mb-3">
                                <span class="material-symbols-outlined text-[18px] mt-0.5">location_on</span>
                                <div class="flex flex-col text-sm">
                                    <!-- Dirección -->
                                    <p class="font-medium" th:text="${estacion.getDireccion()}">Dirección</p>
                                    <!-- Localidad y Código Postal -->
                                    <p th:text="${estacion.getLocalidad() + ' (' + estacion.getCodigoPostal() + ')'}">
                                        Localidad (CP)
                                    </p>

                                    <!-- Municipio y Provincia -->
                                    <p class="uppercase" th:text="${estacion.getMunicipio().getDenominacion() + ', ' + estacion.getProvincia().getDenominacion()}">
                                        Municipio, Provincia
                                    </p>
                                </div>
                            </div>

                        </div>

                        <div class="flex flex-wrap gap-3">
                            <div class="flex items-center gap-1.5 px-3 py-1 rounded-full text-sm font-bold"
                                 th:classappend="${estacion.abierto} ? 'bg-green-50 text-green-700 border border-green-100' : 'bg-red-50 text-red-700 border border-red-100'">
                                <span class="w-2 h-2 rounded-full animate-pulse"
                                      th:classappend="${estacion.isAbierto()} ? 'bg-green-500' : 'bg-red-500'"></span>
                                <span th:text="${estacion.isAbierto()} ? #{eess.estado.abierto} : #{eess.estado.cerrado}"></span>
                            </div>

                            <div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#fcfaf8] text-text-secondary text-sm font-medium border border-[#e8dbce]">
                                <span class="material-symbols-outlined text-[16px]">schedule</span>
                                <span th:text="${estacion.getHorario()}"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="flex flex-col items-end gap-3 w-full md:w-auto">
                    <a class="w-full md:w-auto flex items-center justify-center gap-2 px-6 py-3 bg-white border-2 border-primary text-primary hover:bg-primary hover:text-white transition-all rounded-lg font-bold text-sm shadow-sm group"
                       th:href="@{'https://www.google.com/maps/search/?api=1&query=' +${estacion.coordenada.latitud}+ ','+${estacion.coordenada.longitud}}"
                       target="_blank">
                        <span class="material-symbols-outlined group-hover:animate-bounce">map</span>
                        <span th:text="#{eess.ubicacion.google.maps}"></span>
                    </a>
                    <div class="text-xs text-text-secondary font-medium"
                         th:text="|#{eess.ubicacion.latitud} ${estacion.coordenada.latitud}, #{eess.ubicacion.longitud} ${estacion.coordenada.longitud}|"></div>
                </div>
            </div>
        </div>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            <div class="lg:col-span-2 flex flex-col gap-8">
                <section>
                    <div class="flex items-center gap-2 mb-4">
                        <span class="material-symbols-outlined text-primary">local_gas_station</span>
                        <h2 class="text-xl font-bold text-text-main" th:text="#{eess.combustible.disponible}">Combustible Disponible</h2>
                    </div>
                    <div class="grid gap-4 grid-cols-[repeat(auto-fit,minmax(150px,1fr))]">
                        <div class="bg-surface border border-[#e8dbce] rounded-xl p-4 shadow-sm hover:shadow-md hover:border-primary/50 transition-all flex flex-col items-center justify-center gap-1 group cursor-default"
                             th:each="entrySetPorCombustible : ${preciosCombMap.values().stream().findFirst().get()}">
                            <span class="text-xs uppercase tracking-wider font-bold text-text-secondary"
                                  th:text="${#messages.msg('combustible.' + entrySetPorCombustible.getKey().getCodigo().toLowerCase())}"></span>
                            <span class="text-2xl font-bold text-primary font-mono group-hover:scale-110 transition-transform"
                                  th:text="${#numbers.formatDecimal( entrySetPorCombustible.getValue(), 1, 'COMMA', 3, 'POINT')} + ' €'"></span>
                        </div>
                    </div>
                </section>
                <section class="bg-surface rounded-xl border border-[#e8dbce] p-6 shadow-sm">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6 border-b border-[#f4ede7] pb-4">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary">history</span>
                            <h2 class="text-lg font-bold text-text-main"
                                th:text="#{eess.combustible.precios.historico}"></h2>
                        </div>
                        <form class="flex items-center gap-2" method="get"
                              th:action="@{/estacionesDeServicio/{id}(id=${estacion.id})}">
                            <label class="text-sm font-medium text-text-secondary"
                                   th:text="#{eess.combustible.precios.historico.desde}" for="precios_calendario"></label>
                            <input class="form-input h-9 py-1 px-3 text-sm rounded-lg border-[#e8dbce] bg-[#fcfaf8] text-text-main focus:ring-primary focus:border-primary"
                                   id="precios_calendario"
                                   name="fechaInicio"
                                   type="date"
                                   th:value="${fechaInicio}"
                                   th:max="${T(java.time.LocalDate).now()}"
                                   th:min="${T(java.time.LocalDate).now().minusDays(30)}"
                                   onchange="this.form.submit()"/>
                        </form>
                    </div>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-sm text-left">
                            <!-- Cabecera dinámica de combustibles -->
                            <thead class="text-xs text-text-secondary uppercase bg-[#fcfaf8] border-b border-[#e8dbce]">
                            <tr>
                                <th class="px-4 py-3 font-medium rounded-tl-lg" th:text="#{eess.combustible.precios.historico.fecha}"></th>
                                <!-- Cabecera de combustibles dinámica sin streams -->
                                <th th:each="combustible : ${preciosCombMap.values().stream().findFirst().get().keySet()}"
                                    class="px-4 py-3 font-medium"
                                    th:text="#{${'combustible.'+combustible.getCodigo().toLowerCase()}}"></th>
                            </tr>
                            </thead>

                            <tbody class="divide-y divide-[#f4ede7]">
                            <tr class="hover:bg-[#fcfaf8]" th:each="entryXFecha : ${preciosCombMap}">
                                <td class="px-4 py-3 font-medium text-text-main"
                                    th:text="${#temporals.format(entryXFecha.getKey(), 'dd/MM/yy')}"></td>
                                <td class="px-4 py-3 text-text-secondary"
                                    th:each="precio : ${preciosCombMap.get(entryXFecha.getKey()).values()}"
                                    th:text="${precio + ' €'}"></td>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            <aside class="flex flex-col gap-6">
                <div class="bg-surface rounded-xl border border-[#e8dbce] p-5 shadow-sm">
                    <div class="flex items-center gap-2 mb-4 border-b border-[#f4ede7] pb-3">
                        <span class="material-symbols-outlined text-primary">info</span>
                        <h3 class="text-lg font-bold text-text-main" th:text="#{eess.datos.tecnicos}"></h3>
                    </div>
                    <ul class="flex flex-col gap-4">
                        <li class="flex flex-col gap-1">
                            <span class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                                  th:text="#{eess.datos.venta}"></span>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px] text-primary">public</span>
                                <span class="text-sm font-medium text-text-main"
                                      th:text="#{${estacion.getVenta().getCodigoMensaje() + '.descripcion'}}"></span>
                            </div>
                        </li>
                        <li class="flex flex-col gap-1">
                            <span class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                                  th:text="#{eess.datos.margen}"></span>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px] text-primary">add_road</span>
                                <span class="text-sm font-medium text-text-main"
                                      th:text="#{${estacion.getMargen().getCodigoMensaje()}}"></span>
                            </div>
                        </li>
                        <li class="flex flex-col gap-1">
                            <span class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                                  th:text="#{eess.datos.remision}"></span>
                            <div class="flex items-center gap-2">
                                <span class="material-symbols-outlined text-[18px] text-primary">storefront</span>
                                <span class="text-sm font-medium text-text-main"
                                      th:text="#{${estacion.getRemision().getCodigoMensaje() + '.descripcion'}}"></span>
                            </div>
                        </li>
                    </ul>
                </div>
                <div class="bg-surface rounded-xl border border-[#e8dbce] p-5 shadow-sm">
                    <div class="flex items-center gap-2 mb-4 border-b border-[#f4ede7] pb-3">
                        <span class="material-symbols-outlined text-primary">science</span>
                        <h3 class="text-lg font-bold text-text-main" th:text="#{eess.datos.composicion}"></h3>
                    </div>
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-text-main font-medium"
                                      th:text="#{eess.datos.composicion.bioetanol}"></span>
                                <span class="text-text-secondary font-mono"
                                      th:text="${estacion.getX100BioEtanol() + '%'}"></span>
                            </div>
                            <div class="w-full bg-[#f4ede7] rounded-full h-2">
                                <div class="bg-primary h-2 rounded-full"
                                     th:style="|width: ${estacion.getX100BioEtanol()}%|"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-1">
                                <span class="text-text-main font-medium"
                                      th:text="#{eess.datos.composicion.ester}"></span>
                                <span class="text-text-secondary font-mono"
                                      th:text="${estacion.getX100EsterMetilico() + '%'}"></span>
                            </div>
                            <div class="w-full bg-[#f4ede7] rounded-full h-2">
                                <div class="bg-primary h-2 rounded-full"
                                     th:style="|width: ${estacion.getX100EsterMetilico()}%|"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-primary/5 rounded-xl border border-primary/20 p-5 text-center">
                    <p class="text-sm text-text-main mb-3" th:text="#{eess.info.incorrecta.pregunta}"></p>
                    <a class="text-primary text-sm font-bold hover:underline"
                       th:text="#{eess.info.incorrecta.reporta}" th:href="@{/contacto}"></a>
                </div>
            </aside>
        </div>

    </main>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
