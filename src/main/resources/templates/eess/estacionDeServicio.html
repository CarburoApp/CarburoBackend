<!doctype html>
<html th:lang="${#locale.toLanguageTag()}">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{eess.title}"></title>
</head>
<body class="site-body station-detail-page">
<!-- Cabecera -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Detalle de la estación -->
<main id="app"
      class="station-detail-layout"
      v-cloak
      th:attr="data-station-id=${estacionId},data-app-name=#{app.name},data-locale=${#locale.toLanguageTag()},data-api-key=${publicApiKey},data-api-url=${publicApiUrl}">
            <span hidden
                  sec:authorize="isAuthenticated()"
                  data-favoritos
                  th:attr="data-retirar=#{eess.favoritas.boton.retirar},data-anadir=#{eess.favoritas.boton.anadir}">
            </span>

    <!-- Migas de pan -->
    <nav class="breadcrumbs" th:aria-label="#{breadcrumb.label}">
        <a th:href="@{/}" th:text="#{home.title}"></a>
        <span aria-hidden="true">/</span>
        <a th:href="@{/estaciones-de-servicio}" th:text="#{eess.list.title}"></a>
        <span aria-hidden="true">/</span>
        <span v-if="estacion" aria-current="page">{{ estacion.rotulo }}</span>
        <span v-else aria-current="page" th:text="#{eess.title}"></span>
    </nav>

    <!-- Card de carga del detalle -->
    <section v-if="estadoEstacion === EstadoVista.CARGANDO"
             class="station-feedback loading-state"
             role="status"
             aria-busy="true">
        <div>
            <h1 th:text="#{eess.detalle.cargando}"></h1>
            <progress th:aria-label="#{eess.detalle.cargando}"></progress>
        </div>
    </section>

    <!-- Card de error del detalle -->
    <section v-else-if="estadoEstacion !== EstadoVista.LISTO" class="station-feedback error-state" role="alert">
        <div>
            <h1 v-if="estadoEstacion === EstadoVista.NO_ENCONTRADO" th:text="#{eess.detalle.no.encontrada}"></h1>
            <h1 v-else th:text="#{eess.detalle.error}"></h1>
            <button type="button" @click="cargarEstacion" th:text="#{eess.reintentar}"></button>
            <a th:href="@{/estaciones-de-servicio}" th:text="#{eess.list.title}"></a>
        </div>
    </section>

    <template v-else>
        <!-- Resumen y favoritos -->
        <section class="station-overview" aria-labelledby="station-title">
            <button sec:authorize="isAuthenticated()"
                    type="button"
                        class="favorite-button"
                    @click="cambiarFavorita(estacion.id)"
                    :disabled="cargandoFavoritas || errorFavoritas || favoritasPendientes.includes(estacion.id)"
                    :aria-pressed="esFavorita(estacion.id)"
                    :aria-label="esFavorita(estacion.id) ? textoRetirarFavorita : textoAnadirFavorita">
                <svg class="icon"
                     :class="esFavorita(estacion.id) ? 'favorita-activa' : 'favorita-inactiva'"
                     width="24"
                     height="24"
                     viewBox="0 0 24 24"
                     aria-hidden="true">
                    <use href="/images/icons.svg#heart"></use>
                </svg>
            </button>
            <header class="station-overview-header">
                <div class="station-primary-info">
                    <div class="station-brand-icon" aria-hidden="true">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24">
                            <use href="/images/icons.svg#fuel-pump"></use>
                        </svg>
                    </div>

                    <div>
                        <div class="station-heading">
                            <h1 id="station-title">{{ estacion.rotulo }}</h1>

                            <span>
                                <span th:text="#{eess.id}"></span>
                                {{ estacion.id }}
                            </span>
                        </div>

                        <address class="station-address">
                            <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#map-pin"></use>
                            </svg>

                            <div>
                                <p>{{ estacion.direccion }}</p>
                                <p>
                                    {{ estacion.localidad }} ({{ String(estacion.codigo_postal).padStart(5, '0') }})
                                </p>
                                <p>{{ ubicacionTexto(estacion) }}</p>
                            </div>
                        </address>
                    </div>

                    <div class="station-summary-status">
                        <div class="station-status" :class="estacion.abierto ? 'is-open' : 'is-closed'">
                            <span class="station-status-icon" aria-hidden="true"></span>
                            <span v-if="estacion.abierto" th:text="#{eess.estado.abierto}"></span>
                            <span v-else th:text="#{eess.estado.cerrado}"></span>
                        </div>

                        <p class="station-hours">
                            <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                                <use href="/images/icons.svg#clock"></use>
                            </svg>
                            <span>{{ estacion.horario }}</span>
                        </p>
                    </div>
                </div>
            </header>

            <p v-if="errorFavoritas" class="form-error" role="alert">
                <span th:text="#{eess.favoritas.error}"></span>
                <button type="button" @click="cargarFavoritas" th:text="#{eess.reintentar}"></button>
            </p>

            <p v-if="errorCatalogos" class="form-error" role="alert">
                <span th:text="#{eess.detalle.catalogos.error}"></span>
                <button type="button" @click="cargarCatalogos" th:text="#{eess.reintentar}"></button>
            </p>

            <!-- Ubicación, distancia y mapas -->
            <th:block th:replace="~{fragments/eess/ubicacion-estacion :: ubicacion}"></th:block>
        </section>

        <div class="station-detail-columns">
            <div class="station-detail-sections">
                <!-- Precios actuales -->
                <section class="available-fuels" aria-labelledby="station-fuels-title">
                    <header class="section-heading">
                        <svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                            <use href="/images/icons.svg#fuel-pump"></use>
                        </svg>
                        <h2 id="station-fuels-title" th:text="#{eess.combustible.disponible}"></h2>
                    </header>

                    <ul v-if="preciosOrdenados(estacion).length" class="fuel-card-list">
                        <li v-for="precio in preciosOrdenados(estacion)"
                            :key="precio.id_combustible"
                            class="fuel-card">
                            <span>{{ nombreCombustible(precio.id_combustible) }}</span>
                            <strong>{{ precioFormateado(precio.precio) }}</strong>
                        </li>
                    </ul>

                    <p v-else th:text="#{eess.detalle.precios.vacio}"></p>
                </section>

                <!-- Histórico de precios -->
                <section class="price-history"
                         aria-labelledby="station-history-title"
                         :aria-busy="estadoHistorico === EstadoVista.CARGANDO">
                    <header>
                        <h2 id="station-history-title" th:text="#{eess.combustible.precios.historico}"></h2>
                        <form @submit.prevent>
                            <label for="precios-calendario"
                                   th:text="#{eess.combustible.precios.historico.desde}">
                            </label>

                            <input id="precios-calendario"
                                   name="fechaInicio"
                                   type="date"
                                   required
                                   v-model="fechaInicio"
                                   :min="fechaMinima"
                                   :max="fechaMaxima"
                                   @change="cargarHistorico"/>
                        </form>
                    </header>

                    <p v-if="estadoHistorico === EstadoVista.CARGANDO"
                       role="status"
                       th:text="#{eess.detalle.historico.cargando}">
                    </p>

                    <p v-else-if="estadoHistorico === EstadoVista.ERROR" role="alert">
                        <span th:text="#{eess.detalle.historico.error}"></span>
                        <button type="button" @click="cargarHistorico" th:text="#{eess.reintentar}"></button>
                    </p>
                    <p v-else-if="estadoHistorico === EstadoVista.VACIO"
                       role="status"
                       th:text="#{eess.detalle.historico.vacio}">
                    </p>

                    <div v-else
                         class="table-scroll custom-scrollbar"
                         role="region"
                         tabindex="0"
                         aria-labelledby="station-history-title">
                        <table>
                            <caption class="visually-hidden"
                                     th:text="#{eess.combustible.precios.historico}">
                            </caption>

                            <thead>
                            <tr>
                                <th scope="col" th:text="#{eess.combustible.precios.historico.fecha}"></th>
                                <th v-for="id in combustiblesHistorico" :key="id" scope="col">
                                    {{ nombreCombustible(id) }}
                                </th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr v-for="fila in filasHistorico" :key="fila.fecha">
                                <th scope="row">
                                    <time :datetime="fila.fecha">{{ fechaFormateada(fila.fecha) }}</time>
                                </th>
                                <td v-for="id in combustiblesHistorico" :key="id">
                                    {{ precioFormateado(fila.precios[id]) }}
                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>

            <!-- Datos técnicos y composición -->
            <aside class="station-aside" th:aria-label="#{eess.datos.tecnicos}">
                <section class="technical-card">
                    <header><h2 th:text="#{eess.datos.tecnicos}"></h2></header>
                    <dl>
                        <div>
                            <dt th:text="#{eess.datos.venta}"></dt>
                            <dd v-if="estacion.venta === 'PUBLICA'" th:text="#{venta.publica.descripcion}"></dd>
                            <dd v-else-if="estacion.venta === 'RESTRINGIDA'"
                                th:text="#{venta.restringida.descripcion}">
                            </dd>
                            <dd v-else>{{ estacion.venta }}</dd>
                        </div>
                        <div>
                            <dt th:text="#{eess.datos.margen}"></dt>
                            <dd v-if="estacion.margen === 'DERECHO'" th:text="#{margen.derecho}"></dd>
                            <dd v-else-if="estacion.margen === 'IZQUIERDO'" th:text="#{margen.izquierdo}"></dd>
                            <dd v-else th:text="#{margen.no_aplica}"></dd>
                        </div>
                        <div>
                            <dt th:text="#{eess.datos.remision}"></dt>
                            <dd v-if="estacion.remision === 'OM'" th:text="#{remision.om.descripcion}"></dd>
                            <dd v-else-if="estacion.remision === 'DM'"
                                th:text="#{remision.dm.descripcion}">
                            </dd>
                            <dd v-else>{{ estacion.remision }}</dd>
                        </div>
                    </dl>
                </section>

                <section class="technical-card">
                    <header><h2 th:text="#{eess.datos.composicion}"></h2></header>
                    <dl>
                        <div>
                            <dt class="composition-heading">
                                <span class="composition-percentage">{{ porcentaje(estacion.x100BioEtanol) }} %</span>
                                <span th:text="#{eess.datos.composicion.bioetanol}"></span>
                            </dt>
                            <dd>
                                <meter min="0" max="100"
                                       :value="porcentaje(estacion.x100BioEtanol)"
                                       th:aria-label="#{eess.datos.composicion.bioetanol}">
                                </meter>
                            </dd>
                        </div>

                        <div>
                            <dt class="composition-heading">
                                <span class="composition-percentage">{{ porcentaje(estacion.x100EsterMetilico) }} %</span>
                                <span th:text="#{eess.datos.composicion.ester}"></span>
                            </dt>
                            <dd>
                                <meter min="0" max="100"
                                       :value="porcentaje(estacion.x100EsterMetilico)"
                                       th:aria-label="#{eess.datos.composicion.ester}">
                                </meter>
                            </dd>
                        </div>
                    </dl>
                </section>

                <div class="station-notice">
                    <p th:text="#{eess.info.incorrecta.pregunta}"></p>
                    <a th:href="@{/contacto}" th:text="#{eess.info.incorrecta.reporta}"></a>
                </div>
            </aside>
        </div>
    </template>
</main>
<noscript><p class="surface-card" th:text="#{eess.detalle.sin.javascript}"></p></noscript>

<!-- Pie de página -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script type="module" th:src="@{/assets/estacion-de-servicio.js}"></script>
</body>
</html>
