<!-- eess/estacionDeServicio.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + ${estacion.getRotulo()}"></title>
</head>

<body class="site-body station-detail-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<div class="station-detail-layout">
    <main class="station-detail-main">
        <!-- Breadcrumbs -->
        <nav class="breadcrumbs" th:aria-label="#{breadcrumb.label}">
            <a th:href="@{/}"
               th:text="#{home.title}"></a>
            <span aria-hidden="true">/</span>
            <a th:href="@{/estaciones-de-servicio}"
               th:text="#{eess.list.title}"></a>
            <span aria-hidden="true">/</span>
            <span th:text="${estacion.getProvincia().getDenominacion()}"></span>
            <span aria-hidden="true">/</span>
            <span aria-current="page" th:text="|${estacion.rotulo} (#{eess.id}${estacion.id})|"></span>
        </nav>

        <section class="station-overview">
            <!-- Botón de me gusta-->
            <form th:fragment="botonFavorita(estacion, favorita)" method="post" sec:authorize="isAuthenticated()"
                  th:action="@{/perfil/estaciones-de-servicio/favoritas/{id}(id=${estacion.id})}">
                <button type="submit"
                        class="favorite-button"
                        th:attr="aria-label=#{${favorita}? 'eess.favoritas.boton.retirar': 'eess.favoritas.boton.anadir'},
                        title=#{${favorita}? 'eess.favoritas.boton.retirar': 'eess.favoritas.boton.anadir'}">
                    <svg
                            th:classappend="${favorita} ? 'favorita-activa' : 'favorita-inactiva'" class="icon"
                            focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#heart"></use>
                    </svg>
                </button>
            </form>
            <div class="station-overview-header">
                <div class="station-primary-info">
                    <div class="station-brand-icon">
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#fuel-pump"></use>
                        </svg>
                    </div>
                    <div>
                        <div class="station-heading">
                            <h1
                                th:text="${estacion.getRotulo()}">Rotulo</h1>
                            <span
                                    th:text="|#{eess.id}${estacion.id}|"></span>
                        </div>
                        <div class="station-address">
                            <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#map-pin"></use>
                            </svg>
                            <div>
                                    <!-- Dirección -->
                                <p th:text="${estacion.getDireccion()}">Dirección</p>
                                    <!-- Localidad y Código Postal -->
                                    <p th:text="${estacion.getLocalidad() + ' (' + estacion.getCodigoPostal() + ')'}">
                                        Localidad (CP)
                                    </p>

                                    <!-- Municipio y Provincia -->
                                <p th:text="${estacion.getMunicipio().getDenominacion() + ', ' + estacion.getProvincia().getDenominacion()}">
                                        Municipio, Provincia
                                    </p>
                                </div>
                            </div>

                        </div>

                    <div class="station-summary-status">
                        <div class="station-status"
                             th:classappend="${estacion.abierto} ? 'is-open' : 'is-closed'">
                            <span class="station-status-icon" aria-hidden="true"></span>
                                <span th:text="${estacion.isAbierto()} ? #{eess.estado.abierto} : #{eess.estado.cerrado}"></span>
                            </div>

                        <div class="station-hours">
                            <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#clock"></use>
                            </svg>
                                <span th:text="${estacion.getHorario()}"></span>
                            </div>
                        </div>
                    </div>
                </div>
            <div class="station-actions">
                <a class="button button-primary"
                       th:href="@{'https://www.google.com/maps/search/?api=1&query=' +${estacion.coordenada.latitud}+ ','+${estacion.coordenada.longitud}}"
                   target="_blank" rel="noopener noreferrer">
                    <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#map"></use>
                    </svg>
                        <span th:text="#{eess.ubicacion.google.maps}"></span>
                    </a>
                <div
                         th:text="|#{eess.ubicacion.latitud} ${estacion.coordenada.latitud}, #{eess.ubicacion.longitud} ${estacion.coordenada.longitud}|"></div>
                </div>
        </section>
        <div class="station-detail-columns">
            <div class="station-detail-sections">
                <section class="available-fuels"
                         th:if="${preciosCombMap != null and !#maps.isEmpty(preciosCombMap)}">
                    <div class="section-heading">
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#fuel-pump"></use>
                        </svg>
                        <h2 th:text="#{eess.combustible.disponible}">Combustible Disponible</h2>
                    </div>
                    <div class="fuel-card-list">
                        <div class="fuel-card"
                             th:each="entrySetPorCombustible : ${preciosCombMap.values().stream().findFirst().get()}">
                            <span 
                                  th:text="${#messages.msg('combustible.' + entrySetPorCombustible.getKey().getCodigo().toLowerCase())}"></span>
                            <span 
                                  th:text="${#numbers.formatDecimal( entrySetPorCombustible.getValue(), 1, 'COMMA', 3, 'POINT')} + ' €'"></span>
                        </div>
                    </div>
                </section>
                <section class="price-history"
                         th:if="${preciosCombMap != null and !#maps.isEmpty(preciosCombMap)}">
                    <div>
                        <div>
                            <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                 aria-hidden="true">
                                <use href="/images/icons.svg#history"></use>
                            </svg>
                            <h2
                                th:text="#{eess.combustible.precios.historico}"></h2>
                        </div>
                        <form method="get"
                              th:action="@{/estaciones-de-servicio/{id}(id=${estacion.id})}">
                            <label
                                   th:text="#{eess.combustible.precios.historico.desde}" for="precios_calendario"></label>
                            <input
                                   id="precios_calendario"
                                   name="fechaInicio"
                                   type="date"
                                   th:value="${fechaInicio}"
                                   th:max="${T(java.time.LocalDate).now()}"
                                   th:min="${T(java.time.LocalDate).now().minusDays(30)}"
                                   onchange="this.form.submit()"/>
                        </form>
                    </div>
                    <div class="table-scroll custom-scrollbar">
                        <table>
                            <!-- Cabecera dinámica de combustibles -->
                            <thead>
                            <tr>
                                <th th:text="#{eess.combustible.precios.historico.fecha}"></th>
                                <!-- Cabecera de combustibles dinámica sin streams -->
                                <th th:each="combustible : ${preciosCombMap.values().stream().findFirst().get().keySet()}"

                                    th:text="#{${'combustible.'+combustible.getCodigo().toLowerCase()}}"></th>
                            </tr>
                            </thead>

                            <tbody>
                            <tr th:each="entryXFecha : ${preciosCombMap}">
                                <td
                                    th:text="${#temporals.format(entryXFecha.getKey(), 'dd/MM/yy')}"></td>
                                <td
                                    th:each="precio : ${preciosCombMap.get(entryXFecha.getKey()).values()}"
                                    th:text="${precio + ' €'}"></td>
                            </tbody>
                        </table>
                    </div>
                </section>
            </div>
            <aside class="station-aside">
                <div class="technical-card">
                    <div>
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#info"></use>
                        </svg>
                        <h3 th:text="#{eess.datos.tecnicos}"></h3>
                    </div>
                    <ul>
                        <li>
                            <div>
                                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                     aria-hidden="true">
                                    <use href="/images/icons.svg#globe"></use>
                                </svg>
                                <span th:text="#{eess.datos.venta}"></span>
                            </div>
                            <span
                                    th:text="#{${estacion.getVenta().getCodigoMensaje() + '.descripcion'}}"></span>
                        </li>
                        <li>
                            <div>
                                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                     aria-hidden="true">
                                    <use href="/images/icons.svg#road"></use>
                                </svg>
                                <span th:text="#{eess.datos.margen}"></span>
                            </div>
                            <span
                                    th:text="#{${estacion.getMargen().getCodigoMensaje()}}"></span>
                        </li>
                        <li>
                            <div>
                                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                                     aria-hidden="true">
                                    <use href="/images/icons.svg#store"></use>
                                </svg>
                                <span th:text="#{eess.datos.remision}"></span>
                            </div>
                            <span
                                      th:text="#{${estacion.getRemision().getCodigoMensaje() + '.descripcion'}}"></span>
                        </li>
                    </ul>
                </div>
                <div class="technical-card">
                    <div>
                        <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24"
                             aria-hidden="true">
                            <use href="/images/icons.svg#flask"></use>
                        </svg>
                        <h3 th:text="#{eess.datos.composicion}"></h3>
                    </div>
                    <div>
                        <div>
                            <div>
                                <span 
                                      th:text="#{eess.datos.composicion.bioetanol}"></span>
                                <span 
                                      th:text="${estacion.getX100BioEtanol() + '%'}"></span>
                            </div>
                            <div class="composition-track" role="meter" aria-valuemin="0" aria-valuemax="100"
                                 th:attr="aria-valuenow=${estacion.getX100BioEtanol()},aria-label=#{eess.datos.composicion.bioetanol}">
                                <div
                                     th:style="|width: ${estacion.getX100BioEtanol()}%|"></div>
                            </div>
                        </div>
                        <div>
                            <div>
                                <span 
                                      th:text="#{eess.datos.composicion.ester}"></span>
                                <span 
                                      th:text="${estacion.getX100EsterMetilico() + '%'}"></span>
                            </div>
                            <div class="composition-track" role="meter" aria-valuemin="0" aria-valuemax="100"
                                 th:attr="aria-valuenow=${estacion.getX100EsterMetilico()},aria-label=#{eess.datos.composicion.ester}">
                                <div
                                     th:style="|width: ${estacion.getX100EsterMetilico()}%|"></div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="station-notice">
                    <p th:text="#{eess.info.incorrecta.pregunta}"></p>
                    <a
                       th:text="#{eess.info.incorrecta.reporta}" th:href="@{/contacto}"></a>
                </div>
            </aside>
        </div>

    </main>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
