<!-- eess/estacionDeServicio.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{eess.list.title}"></title>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">
<div id="overlayFiltros"></div>


<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<div class="flex flex-1 w-full max-w-[1400px] mx-auto px-4 py-6 md:px-8 gap-8">

    <!-- Left Sidebar: Filters (desktop y móvil) -->
    <aside id="asideFiltros" class="flex flex-col w-80 min-w-[320px] gap-6 shrink-0 h-fit sticky top-24">
        <div class="bg-surface rounded-xl border border-border-color p-5 shadow-sm">

            <!-- Cabecera visible siempre -->
            <div class="flex items-center gap-2 mb-6 border-b border-border-color pb-4" id="cabeceraFiltros">
                <span class="material-symbols-outlined text-primary">filter_list</span>
                <h3 class="text-lg font-bold text-text-main" th:text="#{eess.list.filtros}"></h3>
            </div>

            <form id="formFiltros" method="get" th:action="@{/estaciones-de-servicio/old}">

                <div class="flex flex-col gap-5">
                    <!-- Search Text -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                               for="filtro_buscador"
                               th:text="#{eess.list.filtros.buscar}"></label>
                        <div class="flex w-full items-stretch rounded-lg h-10 bg-[#f4ede7]">
                            <div class="text-[#9c7349] flex items-center justify-center pl-3 pr-1">
                                <span class="material-symbols-outlined text-[20px]">search</span>
                            </div>
                            <input id="filtro_buscador" type="text" name="busqueda" th:value="${busqueda}"
                                   class="w-full bg-transparent border-none focus:ring-0 text-sm placeholder:text-[#9c7349]/70 text-text-main"
                                   th:placeholder="#{eess.list.filtros.buscar.placeholder}"/>
                        </div>
                    </div>

                    <!-- Location Filters -->
                    <div class="flex flex-col gap-3">

                        <!-- Label global del bloque -->
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider mb-1"
                                th:text="#{eess.list.filtros.ubicacion}">
                        </label>


                        <label class="text-sm font-medium text-text-main" for="filtro_ccaa"
                               th:text="#{eess.list.filtros.ubicacion.ccaa}"></label>
                        <select id="filtro_ccaa" name="comunidadSeleccionada" th:value="${comunidadSeleccionada}"
                                class="w-full h-10 rounded-lg border border-[#e8dbce] bg-[#fcfaf8] text-sm text-text-main
                               focus:ring-1 focus:ring-primary focus:border-primary">
                            <option th:value="0" th:text="#{eess.list.filtros.indiferente}"
                                    th:selected="${comunidadSeleccionada == '0'}"></option>
                            <option th:each="comunidad : ${comunidades}"
                                    th:value="${comunidad.getId()}"
                                    th:text="${comunidad.getDenominacion()}"
                                    th:selected="${comunidad.getId()} == ${comunidadSeleccionada}"></option>
                        </select>

                        <label class="text-sm font-medium text-text-main" for="filtro_provincia"
                               th:text="#{eess.list.filtros.ubicacion.provincia}"></label>
                        <select id="filtro_provincia" name="provinciaSeleccionada" th:value="${provinciaSeleccionada}"
                                class="w-full h-10 rounded-lg border border-[#e8dbce] bg-[#fcfaf8] text-sm text-text-main
                               focus:ring-1 focus:ring-primary focus:border-primary"
                                th:disabled="${comunidadSeleccionada == '0'}">
                            <option th:value="0" th:text="#{eess.list.filtros.indiferente}"></option>
                            <option th:each="provincia : ${provincias}" th:value="${provincia.getId()}"
                                    th:text="${provincia.getDenominacion()}"
                                    th:selected="${provincia.getId() == provinciaSeleccionada}"></option>
                        </select>

                        <label class="text-sm font-medium text-text-main" for="filtro_municipio"
                               th:text="#{eess.list.filtros.ubicacion.municipio}"></label>
                        <select id="filtro_municipio" name="municipioSeleccionado" th:value="${municipioSeleccionado}"
                                class="w-full h-10 rounded-lg border border-[#e8dbce] bg-[#fcfaf8] text-sm text-text-main
                               focus:ring-1 focus:ring-primary focus:border-primary"
                                th:disabled="${provinciaSeleccionada == '0'}">
                            <option th:value="0" th:text="#{eess.list.filtros.indiferente}"></option>
                            <option th:each="municipio : ${municipios}" th:value="${municipio.getId()}"
                                    th:text="${municipio.getDenominacion()}"
                                    th:selected="${municipio.getId() == municipioSeleccionado}"></option>
                        </select>
                    </div>

                    <!-- Order By TODO ELIMINAR SI FINALMENTE NO SE USO
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider" for="ordenacion"
                               th:text="#{eess.list.filtros.ordenar.label}"></label>
                        <select id="ordenacion" name="ordenSeleccionado" th:value="${ordenSeleccionado}" class="w-full h-10 rounded-lg border border-[#e8dbce] bg-[#fcfaf8] text-sm text-text-main
                               focus:ring-1 focus:ring-primary focus:border-primary">
                            <option th:value="price_asc" th:text="#{eess.list.filtros.orden.precio.asc}"
                                    th:selected="${ordenSeleccionado == 'price_asc'}"></option>
                            <option th:value="price_desc" th:text="#{eess.list.filtros.orden.precio.desc}"
                                    th:selected="${ordenSeleccionado == 'price_desc'}"></option>
                            <option th:value="name_asc" th:text="#{eess.list.filtros.orden.alfabetico.asc}"
                                    th:selected="${ordenSeleccionado == 'name_asc'}"></option>
                            <option th:value="name_desc" th:text="#{eess.list.filtros.orden.alfabetico.desc}"
                                    th:selected="${ordenSeleccionado == 'name_desc'}"></option>
                        </select>
                    </div>
                    -->

                    <!-- Status Slider -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                               for="filtro_estado"
                               th:text="#{eess.list.filtros.estado}"></label>

                        <!-- Inputs radio ocultos -->
                        <label for="filtro_abierto" class="sr-only" th:text="#{eess.estado.abierto}"></label>
                        <input type="radio" name="estadoSeleccionado" value="ABIERTO" class="oculto" id="filtro_abierto"
                               th:checked="${estadoSeleccionado=='ABIERTO'}" hidden>
                        <label for="filtro_cerrado" class="sr-only" th:text="#{eess.estado.cerrado}"></label>
                        <input type="radio" name="estadoSeleccionado" value="CERRADO" class="oculto" id="filtro_cerrado"
                               th:checked="${estadoSeleccionado=='CERRADO'}" hidden>
                        <label for="filtro_indiferente" class="sr-only" th:text="#{eess.list.estado.indiferente}"></label>
                        <input type="radio" name="estadoSeleccionado" value="INDEFERENTE" class="oculto" id="filtro_indiferente"
                               th:checked="${estadoSeleccionado=='INDEFERENTE'}" hidden>

                        <!-- Botones visuales -->
                        <div id="filtro_estado" class="flex bg-[#f4ede7] p-1 rounded-lg">
                            <button type="button" data-value="ABIERTO"
                                    class="flex-1 py-1.5 text-xs font-medium rounded-md hover:bg-white/50 transition-colors"
                                    th:classappend="${estadoSeleccionado=='ABIERTO'} ? ' bg-white text-primary shadow-sm' : ''"
                                    th:text="#{eess.estado.abierto}"></button>

                            <button type="button" data-value="CERRADO"
                                    class="flex-1 py-1.5 text-xs font-medium rounded-md hover:bg-white/50 transition-colors"
                                    th:classappend="${estadoSeleccionado=='CERRADO'} ? ' bg-white text-primary shadow-sm' : ''"
                                    th:text="#{eess.estado.cerrado}"></button>

                            <button type="button" data-value="INDEFERENTE"
                                    class="flex-1 py-1.5 text-xs font-medium rounded-md hover:bg-white/50 transition-colors"
                                    th:classappend="${estadoSeleccionado=='INDEFERENTE'} ? ' bg-white text-primary shadow-sm' : ''"
                                    th:text="#{eess.list.estado.indiferente}"></button>
                        </div>
                    </div>


                    <!-- Fuel Types -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider"
                               for="filtro_combustibles_disponibles"
                               th:text="#{eess.list.filtros.combustibles}"></label>
                        <div id="filtro_combustibles_disponibles"
                             class="h-32 overflow-y-auto custom-scrollbar border border-[#e8dbce] rounded-lg p-3 bg-[#fcfaf8]">
                            <div class="space-y-2">
                                <label class="flex items-center gap-2 cursor-pointer"
                                       th:each="combustibledto : ${combustibles}">
                                    <input class="rounded text-primary focus:ring-primary border-[#e8dbce]"
                                           type="checkbox" name="combustibles"
                                           th:checked="${combustibledto.isSeleccionado}"
                                           th:value="${combustibledto.getCodigo()}"
                                           th:text="${#messages.msg('combustible.' + combustibledto.getCodigo().toLowerCase())}"/>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Brand -->
                    <div class="flex flex-col gap-2">
                        <label class="text-xs font-bold text-text-secondary uppercase tracking-wider" for="filtro_marca"
                               th:text="#{eess.list.filtros.marca}"></label>
                        <select id="filtro_marca" name="marcaSeleccionada" th:value="${marcaSeleccionada}" class="w-full h-10 rounded-lg border border-[#e8dbce] bg-[#fcfaf8] text-sm text-text-main
                               focus:ring-1 focus:ring-primary focus:border-primary"
                        >
                            <option th:value="0NOTSELECTED" th:text="#{eess.list.filtros.indiferente}"></option>
                            <option th:each="marca : ${marcas}" th:value="${marca}" th:text="${marca}"
                                    th:selected="${marca == marcaSeleccionada}"></option>
                        </select>
                    </div>
                </div>
            </form>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Breadcrumbs -->
        <div class="flex flex-wrap gap-2 py-2 mb-4 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/}"
               th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <a class="text-text-secondary font-medium hover:underline" th:href="@{/estaciones-de-servicio/old}"
               th:text="#{eess.list.title}"></a>
        </div>
        <!-- Page Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-end gap-4 mb-8 border-b border-border-color pb-4">
            <div>
                <h1 class="text-text-main text-3xl font-bold leading-tight mb-2" th:text="#{eess.list.title}"></h1>
                <p class="text-text-secondary text-sm"
                   th:text="#{eess.list.introduccion(${page.numberOfElements},${page.totalElements})}"></p>
            </div>
            <!-- Mobile Filter Toggle (Visible only on small screens) -->
            <button id="btnMobileFiltros"
                    class="lg:hidden flex items-center gap-2 px-4 py-2 bg-white border border-[#e8dbce] rounded-lg shadow-sm text-sm font-medium"
                    th:text="#{eess.list.filtros}">
                <span class="material-symbols-outlined">filter_list</span>
            </button>
        </div>
        <!-- Results List -->
        <div class="flex flex-col gap-4">
            <!-- Station Card -->
            <article th:each="estacion : ${page}"
                     th:insert="~{fragments/estacionDeServicio :: card(estacion=${estacion})}"
                     class="bg-surface rounded-xl border border-[#e8dbce] shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden group"
                     th:classappend="${estacion.isAbierto()} ? '' : 'opacity-90'">

            </article>
        </div>

        <!-- Paginacion -->
        <th:block th:replace="~{fragments/paginacion :: paginacion}"></th:block>

    </main>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>
<script src="/script/filtrosPathListadoEstacionesDeServicio.js"></script>
<script src="/script/filtrosListadoEstacionesDeServicio.js"></script>

</body>
</html>
