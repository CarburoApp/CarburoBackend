<!-- templates/contacto.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{contacto.title}"></title>

    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#f48c25",
                        "background-light": "#fcfaf8",
                        "background-dark": "#221910",
                        "surface": "#ffffff",
                        "border-color": "#f4ede7",
                        "text-main": "#1c140d",
                        "text-secondary": "#9c7349",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"],
                        "body": ["Inter", "sans-serif"],
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main class="flex-1 flex items-center justify-center py-12 px-4">
    <div class="max-w-3xl w-full text-center">
        <div class="flex justify-center gap-2 py-2 mb-8 text-sm">
            <a class="text-text-secondary font-medium hover:underline" th:href="${'/home'}" th:text="#{home.title}"></a>
            <span class="text-text-secondary font-medium">/</span>
            <span class="text-text-main font-medium" th:href="${'/contacto'}" th:text="#{contacto.title}"></span>
        </div>
        <h1 class="text-text-main text-4xl md:text-5xl font-bold leading-tight mb-8" th:text="#{contacto.title}"></h1>
        <div class="bg-surface rounded-2xl border border-border-color p-8 md:p-12 shadow-sm mb-10 text-left">
            <div class="flex items-start gap-4 mb-8">
                <div class="p-3 bg-primary/10 rounded-xl text-primary shrink-0">
                    <span class="material-symbols-outlined text-3xl">school</span>
                </div>
                <div>
                    <h3 class="text-lg font-bold text-text-main mb-2" th:text="#{contacto.proyecto}"></h3>
                    <p class="text-text-secondary leading-relaxed" th:text="#{contacto.proyecto.descripcion}"></p>
                </div>
            </div>
            <div class="grid md:grid-cols-2 gap-8 border-t border-border-color pt-8">
                <div>
                    <p class="text-xs font-bold text-text-secondary uppercase tracking-widest mb-1"
                       th:text="#{contacto.autoria}"></p>
                    <p class="text-lg font-medium text-text-main"
                       th:text="#{app.copy} + ' ' + ${#dates.format(#dates.createNow(), 'yyyy')}"></p>
                </div>
                <div>
                    <p class="text-xs font-bold text-text-secondary uppercase tracking-widest mb-1"
                       th:text="#{contacto.estado}"></p>
                    <p class="text-lg font-medium text-text-main" th:text="#{contacto.estado.descripcion}"></p>
                </div>
            </div>
        </div>
        <div class="flex flex-col items-center">
            <p class="text-text-secondary mb-6 font-medium" th:text="#{contacto.email.etiqueta}"></p>
            <a class="group relative flex items-center gap-4 bg-white border-2 border-primary rounded-2xl p-6 md:px-10 hover:bg-primary transition-all duration-300 shadow-lg hover:shadow-primary/20"
               th:href="${'mailto:' + email}">
                <div class="bg-primary group-hover:bg-white p-3 rounded-full text-white group-hover:text-primary transition-colors">
                    <span class="material-symbols-outlined text-3xl flex items-center justify-center">mail</span>
                </div>
                <div class="text-left">
                    <p class="text-xs font-bold text-primary group-hover:text-white/80 uppercase tracking-widest transition-colors"
                       th:text="#{contacto.email}"></p>
                    <p class="text-xl md:text-2xl font-bold text-text-main group-hover:text-white transition-colors"
                       th:text="${email}"></p>
                </div>
                <div class="ml-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <span class="material-symbols-outlined text-white">arrow_forward</span>
                </div>
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
