<!-- templates/contacto.html -->
<!DOCTYPE html>
<html th:lang="${#locale.toLanguageTag()}">
<!-- head -->
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{contacto.title}"></title>
</head>

<body class="site-body contact-page">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal -->
<main>
    <div class="contact-content">
        <nav class="breadcrumbs" th:aria-label="#{breadcrumb.label}">
            <a th:href="@{/}" th:text="#{home.title}"></a>
            <span aria-hidden="true">/</span>
            <span aria-current="page" th:text="#{contacto.title}"></span>
        </nav>
        <h1 th:text="#{contacto.title}">Contacto</h1>
        <div class="contact-card">
            <div class="contact-project">
                <div>
                    <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                        <use href="/images/icons.svg#graduation-cap"></use>
                    </svg>
                </div>
                <div>
                    <h3 th:text="#{contacto.proyecto}">Proyecto</h3>
                    <p th:text="#{contacto.proyecto.descripcion}"></p>
                </div>
            </div>
            <dl class="contact-meta">
                <div>
                    <dt class="section-label" th:text="#{contacto.autoria}"></dt>
                    <dd th:text="#{contacto.autoria.descripcion}"></dd>
                </div>
                <div>
                    <dt class="section-label" th:text="#{contacto.estado}"></dt>
                    <dd th:text="#{contacto.estado.descripcion}"></dd>
                </div>
            </dl>
        </div>
        <div class="contact-email">
            <p th:text="#{contacto.email.etiqueta}"></p>
            <a th:href="${'mailto:' + email}">
                <svg class="icon" focusable="false" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                    <use href="/images/icons.svg#mail"></use>
                </svg>
                <span><strong th:text="#{contacto.email}"></strong><br/><span th:text="${email}"></span></span>
            </a>
        </div>
    </div>
</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
