<!-- templates/inicio.html -->
<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <title th:text="#{app.name} + ' - ' + #{home.title}"></title>

    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>


</head>

<body class="bg-background-light dark:bg-background-dark text-text-main min-h-screen flex flex-col font-display">

<!-- Header -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<!-- Contenido principal con layout asimétrico -->
<main class="flex-auto flex flex-col md:flex-row gap-8 px-4 py-4 max-w-[1400px] mx-auto">

    <!-- Columna izquierda: hero + búsqueda + estación -->
    <div class="flex-1 flex flex-col gap-6">

        <!-- Hero y búsqueda -->
        <section class="py-2 bg-gradient-to-b from-white to-background-light">
            <div class="max-w-4xl mx-auto text-center">
                <h1 class="text-4xl md:text-6xl font-bold text-text-main leading-tight mb-2 tracking-tight">
                    <span th:text="#{home.titulo1}"></span>
                    <span class="text-primary" th:text="#{home.titulo2}"></span>
                    <span th:text="#{home.titulo3}"></span>
                </h1>
                <p class="text-lg text-text-secondary mb-1 max-w-xl mx-auto" th:text="#{home.subtitulo}"></p>
                <div class="relative max-w-2xl mx-auto">
                    <form class="flex items-center bg-surface border border-border-color shadow-xl rounded-2xl p-2 focus-within:ring-2 focus-within:ring-primary/20 transition-all"
                          th:action="@{/estacionDeServicio/list}" method="get">
                        <div class="flex-auto flex items-center px-4">
                            <span class="material-symbols-outlined text-text-secondary mr-3">search</span>
                            <!-- Label accesible, invisible -->
                            <label for="busqueda" class="sr-only" th:text="#{home.buscar.boton}"></label>
                            <input class="w-full border-none focus:ring-0 text-text-main bg-transparent placeholder:text-text-secondary/50 py-3"
                                   type="text"
                                   id="busqueda"
                                   name="busqueda"
                                   th:placeholder="#{home.buscar.placeholder}" />
                        </div>

                        <button type="submit"
                                class="bg-primary hover:bg-primary/90 text-white font-bold py-2 px-2 rounded-xl transition-colors"
                                th:text="#{home.buscar.boton}">
                        </button>
                    </form>
                    <div class="mt-4 flex flex-wrap justify-center gap-2"
                         th:if="${busquedasPopulares != null and !#maps.isEmpty(busquedasPopulares)}">
                        <span class="text-xs text-text-secondary font-medium" th:text="#{home.busqueda.popular}"></span>
                        <a th:each="entry : ${busquedasPopulares}"
                           th:href="@{${entry.value}}"
                           th:text="${entry.key}"
                           class="text-xs text-primary hover:underline font-bold">
                        </a>
                    </div>
                </div>
            </div>
        </section>

        <!-- Estación más cercana -->
        <section class="py-2">
            <!-- Estación más cercana -->
            <div class="flex items-center gap-3 mb-2">
                <span class="material-symbols-outlined text-primary text-3xl">near_me</span>
                <h2 class="text-2xl font-bold text-text-main" th:text="#{home.eess.cercana}"></h2>
            </div>

            <div class="max-w-4xl" th:fragment="estacionCercanaFragment" id="estacionCercanaFragment">
                <article
                        class="bg-surface rounded-xl border border-[#e8dbce] shadow-sm hover:shadow-md transition-shadow duration-200 overflow-hidden group"
                        id="estacion-container">

                    <div th:if="${estacionCercana != null}" th:replace="fragments/estacionDeServicio"></div>

                    <!-- Si no hay estación, mostramos mensaje bonito -->
                    <div th:if="${estacionCercana == null}"
                         class="flex flex-col items-center justify-center py-12 space-y-4" id="loading-estacion">
                        <!-- Mensaje principal -->
                        <p class="text-lg font-semibold text-text-primary"
                           th:text="#{home.eess.cercana.calculando}"></p>
                        <!-- Mensaje secundario opcional -->
                        <p class="text-text-secondary text-sm text-center max-w-md"
                           th:text="#{home.eess.cercana.tiempo.espera}"></p>
                        <!-- Placeholder visual tipo tarjeta vacía -->
                        <div class="w-full h-2 bg-gray-100 rounded-lg border border-dashed border-gray-300 animate-pulse"></div>
                    </div>
                </article>
            </div>
        </section>

    </div>

    <!-- Columna derecha: secciones inferiores apiladas -->
    <div class="flex flex-col gap-6 md:w-1/4">
        <div class="flex flex-col items-center text-center p-6 bg-surface rounded-2xl border border-border-color shadow-sm">
            <div class="size-16 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-6">
                <span class="material-symbols-outlined text-3xl">update</span>
            </div>
            <h3 class="text-lg font-bold text-text-main mb-3" th:text="#{home.precios.tiempo.real}"></h3>
            <p class="text-text-secondary text-sm" th:text="#{home.precios.tiempo.real.descripcion}"></p>
        </div>

        <div class="flex flex-col items-center text-center p-6 bg-surface rounded-2xl border border-border-color shadow-sm">
            <div class="size-16 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-6">
                <span class="material-symbols-outlined text-3xl">favorite</span>
            </div>
            <h3 class="text-lg font-bold text-text-main mb-3" th:text="#{home.favoritos}"></h3>
            <p class="text-text-secondary text-sm" th:text="#{home.favoritos.descripcion}"></p>
        </div>

        <div class="flex flex-col items-center text-center p-6 bg-surface rounded-2xl border border-border-color shadow-sm">
            <div class="size-16 bg-primary/10 rounded-full flex items-center justify-center text-primary mb-6">
                <span class="material-symbols-outlined text-3xl">history</span>
            </div>
            <h3 class="text-lg font-bold text-text-main mb-3" th:text="#{home.historial.repostajes}"></h3>
            <p class="text-text-secondary text-sm" th:text="#{home.historial.repostajes.descripcion}"></p>
        </div>
    </div>

</main>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- Geolocalización del usuario -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        if (!("geolocation" in navigator)) return;

        const csrfToken = document
            .querySelector('meta[name="_csrf"]')
            .getAttribute('content');

        const csrfHeader = document
            .querySelector('meta[name="_csrf_header"]')
            .getAttribute('content');

        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 15000,    // 15 segundos
            maximumAge: 300000 // 5 minutos
        };

        navigator.geolocation.getCurrentPosition(
            function (position) {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;

                fetch("/inicio/ubicacion", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        [csrfHeader]: csrfToken
                    },
                    body: `lat=${lat}&lon=${lon}`
                })
                    .then(res => res.text())
                    .then(html => {
                        const container = document.getElementById("estacion-container");
                        container.innerHTML = html; // insertamos fragmento Thymeleaf
                        // Ocultar loader siempre
                        const loader = document.getElementById("loading-estacion");
                        if (loader) loader.remove();
                    })
                    .catch(err => console.error("Error en fetch:", err));

            },
            function (error) {
                console.error("Error al obtener la ubicación:", error);
                const container = document.getElementById("estacion-container");
                container.innerHTML = `<div class="text-center text-text-secondary text-lg font-medium mt-4">
                No hemos podido localizar la estación más cercana.
            </div>`;
            },
            geoOptions
        );

    });
</script>


</body>
</html>
