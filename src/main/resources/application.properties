# Nombre de la aplicación
spring.application.name=Carburo

# Configuración de la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración JPA/Hibernate
# Solo valida el esquema, no toca nada en la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Paginación
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Correo de contacto para la página "Contacto"
contacto.email=${EMAIL_CONTACTO}

# ======================================================
# Configuración HTTPS (local)
# ======================================================

# Activar HTTPS
server.ssl.enabled=true

# Puerto HTTPS para desarrollo local (puede ser 8443)
server.port=8443

# Ruta del keystore generado (certificado auto-firmado)
# Lo mejor es ponerlo en src/main/resources y referenciarlo con classpath
server.ssl.key-store=classpath:keystore.p12

# Contraseña del keystore (la que pusiste al generarlo)
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}

# Tipo de keystore (PKCS12 en nuestro caso)
server.ssl.key-store-type=PKCS12

# Alias del certificado dentro del keystore
server.ssl.key-alias=${SSL_KEY_ALIAS}