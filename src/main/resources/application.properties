# Nombre de la aplicación
spring.application.name=Carburo
app.url = https://carburo.app

# Configuración de la base de datos PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
# Configuración con el sistema de Auth de Supabase. Completar las Variables de entorno.
security.supabase.auth.url=${SUPABASE_AUTH_URL}
security.supabase.auth.role-key=${SERVICE_ROLE_KEY}

# Configuración JPA/Hibernate
# Solo valida el esquema, no toca nada en la base de datos
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=OFF
logging.level.org.hibernate.orm.connections.pooling=ERROR

# Configuración Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
# Paginación
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Correo de contacto para la página "Contacto"
contacto.email=${EMAIL_CONTACTO}

security.api.public-key=${PUBLIC_API_KEY}
security.api.public-url=${PUBLIC_API_URL}

# ======================================================
# Configuración HTTP (local)
# ======================================================

server.port=8088
server.forward-headers-strategy=framework